name: Service containers

# Publication is an explicit operator action until release qualification is complete.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable release tag to build'
        required: true
        type: string

concurrency:
  group: service-containers-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            context: .
            dockerfile: server/deploy/Dockerfile
          - service: relay
            context: .
            dockerfile: relay/deploy/Dockerfile
          - service: tunnel
            context: .
            dockerfile: tunnel/deploy/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          ./cli/tools/release-version.sh validate-format "$RELEASE_TAG"
          tag_ref="refs/tags/$RELEASE_TAG"
          source_sha=$(git ls-remote origin "$tag_ref" "$tag_ref^{}" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { commit=$1 } END { print peeled ? peeled : commit }')
          test -n "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ inputs.release_tag }}
          build-args: |
            PAPERBOAT_VERSION=${{ inputs.release_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
