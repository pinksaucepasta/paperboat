name: Container

on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*"]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: pinksaucepasta/paperboat-relay/.github/workflows/service-container-release.yml@main
    with:
      dockerfile: deploy/Dockerfile
    secrets: inherit
