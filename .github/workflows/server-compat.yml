name: Server compat

# Signed artifacts the server emits must decode with the oldest supported official pb
# (tools/compat/OLDEST_OFFICIAL). Red here means a server change would break released clients.
on:
  push:
    branches: [main]
    paths: ['server/**', 'shared/**', 'tools/compat/**', '.github/workflows/server-compat.yml']
  pull_request:
    paths: ['server/**', 'shared/**', 'tools/compat/**', '.github/workflows/server-compat.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - run: sh tools/compat/run.sh
