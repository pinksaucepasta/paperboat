name: Lane test

# Heavy suites for lanes, so the shared build host only builds and runs single packages.
# Run it with tools/ci-test.sh, or push any commit to a ci/** branch (every module, the console).
# workflow_dispatch narrows it: `modules` (space separated; default all) and `run` (go test -run).
# The nightly run on main keeps the Go build caches warm for the ci/** branches (caches are only
# written from main; other refs read them).

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      modules:
        description: 'Modules to test: shared cli relay tunnel helper server console sdk/go smoke e2e (empty = all)'
        default: ''
      run:
        description: 'go test -run pattern (empty = all tests)'
        default: ''
      count:
        description: 'go test -count: repeat each test (flake check)'
        default: '1'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: lane-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.plan.outputs.go }}
      console: ${{ steps.plan.outputs.console }}
      smoke: ${{ steps.plan.outputs.smoke }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - id: plan
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          all="shared cli relay tunnel helper server console sdk/go smoke e2e"
          want="${MODULES:-$all}"
          for m in $want; do
            case " $all " in *" $m "*) ;; *) echo "unknown module '$m' (modules: $all)" >&2; exit 1 ;; esac
          done
          # server and tunnel also run their PostgreSQL suites (a service container below).
          go=$(for m in $want; do [ "$m" = console ] || [ "$m" = smoke ] || [ "$m" = e2e ] || echo "$m"; done |
            jq -R '{module: ., pg: (. == "server" or . == "tunnel")}' | jq -sc .)
          echo "go=$go" >> "$GITHUB_OUTPUT"
          case " $want " in *" console "*) echo "console=true" ;; *) echo "console=false" ;; esac >> "$GITHUB_OUTPUT"
          case " $want " in *" smoke "*) echo "smoke=true" ;; *) echo "smoke=false" ;; esac >> "$GITHUB_OUTPUT"
          case " $want " in *" e2e "*) echo "e2e=true" ;; *) echo "e2e=false" ;; esac >> "$GITHUB_OUTPUT"

  go:
    name: go ${{ matrix.module }}
    needs: plan
    if: needs.plan.outputs.go != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.go) }}
    services:
      # An isolated, empty database that exists only for this job; the *_test names are what the
      # tests' ValidateIsolatedTestDSN requires. PostgreSQL suites run only for modules with pg=true.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      RUN: ${{ inputs.run }}
      COUNT: ${{ inputs.count || '1' }}
      PAPERBOAT_TEST_DATABASE_DSN: ${{ matrix.pg && 'postgres://postgres:postgres@localhost:5432/lane_test?sslmode=disable&statement_timeout=600000' || '' }}
      # Every go test step saves its -json events here; the skip audit job reads them all (no silent skips).
      GOTEST_EVENTS: ${{ github.workspace }}/gotest-events
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - id: paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.paths.outputs.build }}
            ${{ steps.paths.outputs.mod }}
          # One entry per module and dependency set: the Go build cache is content addressed, so an
          # entry from an older commit still serves everything that did not change.
          key: lane-test-go-${{ matrix.module }}-${{ hashFiles('go.work.sum', '*/go.sum', 'sdk/go/go.sum') }}
          restore-keys: |
            lane-test-go-${{ matrix.module }}-
      - name: Check shared import boundary
        if: matrix.module == 'shared'
        run: ../tools/check-shared-imports.sh
      - run: go vet ./...
      # The same non-test checks as main's Server checks job (make check; Makefile policy-checks), so a green
      # full-module lane run means main goes green too. Narrowed -run runs skip them to stay fast.
      - name: server policy checks and static analysis
        if: matrix.module == 'server' && inputs.run == ''
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml python3-cryptography
          python3 -m unittest discover -s ../.github/tests -p 'test_*.py'
          make policy-checks static-analysis
      - name: go test -race
        run: |
          set -o pipefail
          mkdir -p "$GOTEST_EVENTS"
          run=(); v=(); [ -z "$RUN" ] || { run=(-run "$RUN"); v=(--verbose); }
          report() { python3 "$GITHUB_WORKSPACE/tools/gotest-json.py" --save "$GOTEST_EVENTS/$1.jsonl" "${v[@]}"; }
          # Without a PostgreSQL DSN no package needs a database: one run covers them all.
          if [ -z "$PAPERBOAT_TEST_DATABASE_DSN" ]; then
            go test -json -race -count="$COUNT" -timeout 30m "${run[@]}" ./... | report main
            exit
          fi
          # Every package gets its own empty database, created here, so no package sees rows another
          # package left behind. Packages run one after another; every failing package is reported.
          mod=$(go list -f '{{.Module.Path}}' ./... | head -n1)
          export PGPASSWORD=postgres
          failed=0
          for pkg in $(go list ./...); do
            db="lane_$(sed -e "s|^$mod/||" -e 's|[^A-Za-z0-9]|_|g' <<<"$pkg")_test"
            psql -h localhost -U postgres -qc "create database \"$db\"" || { failed=1; continue; }
            PAPERBOAT_TEST_DATABASE_DSN="${PAPERBOAT_TEST_DATABASE_DSN/lane_test\?/$db?}" \
              go test -json -race -count="$COUNT" -timeout 30m "${run[@]}" "$pkg" | report main || failed=1
          done
          exit $failed
      # F21-15: the server behind a real PgBouncer in transaction mode (PlanetScale's pooler), with its own role,
      # because the test stores role defaults (ALTER ROLE ... SET) that must not reach the other packages' role.
      - name: server behind PgBouncer (transaction pooling)
        if: matrix.module == 'server' && !cancelled() && (inputs.run == '' || contains(inputs.run, 'PgBouncer'))
        run: |
          set -o pipefail
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -qc "create role pgb_app login superuser password 'pgb_app_test'"
          psql -h localhost -U postgres -qc "create database lane_pgbouncer_test owner pgb_app"
          sudo apt-get install -y --no-install-recommends pgbouncer >/dev/null
          # The package starts its own service on 6432; stop it so this job's bouncer owns the port.
          sudo systemctl stop pgbouncer
          pgbouncer --version
          cat > /tmp/pgbouncer.ini <<'INI'
          [databases]
          lane_pgbouncer_test = host=127.0.0.1 port=5432 dbname=lane_pgbouncer_test
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = scram-sha-256
          auth_file = /tmp/pgbouncer-users.txt
          pool_mode = transaction
          max_prepared_statements = 1000
          default_pool_size = 20
          logfile = /tmp/pgbouncer.log
          pidfile = /tmp/pgbouncer.pid
          INI
          sed -i 's/^          //' /tmp/pgbouncer.ini
          # PgBouncer logs in to PostgreSQL with SCRAM, so its auth file holds the role's SCRAM secret (PgBouncer docs).
          secret=$(psql -h localhost -U postgres -Atc "select rolpassword from pg_authid where rolname='pgb_app'")
          printf '"pgb_app" "%s"\n' "$secret" > /tmp/pgbouncer-users.txt
          pgbouncer -d /tmp/pgbouncer.ini
          sleep 1
          trap 'tail -20 /tmp/pgbouncer.log' EXIT
          PAPERBOAT_TEST_PGBOUNCER_DSN="postgres://pgb_app:pgb_app_test@127.0.0.1:6432/lane_pgbouncer_test?sslmode=disable" \
          PAPERBOAT_TEST_DATABASE_DSN="postgres://pgb_app:pgb_app_test@127.0.0.1:5432/lane_pgbouncer_test?sslmode=disable" \
            go test -json -race -count=1 -run '^TestServerRunsBehindTransactionPoolingPgBouncerOnPostgres$' ./internal/db |
            python3 ../tools/gotest-json.py --save "$GOTEST_EVENTS/pgbouncer.jsonl" --verbose
      # F21-15: every endpoint in server/internal/perf/budgets.json within its latency and query budget, on its own
      # seeded database (it skipped everywhere before, and its seed had drifted). No -race: it measures latency.
      - name: server performance budgets (seeded PostgreSQL)
        if: matrix.module == 'server' && !cancelled() && (inputs.run == '' || contains(inputs.run, 'Performance'))
        run: |
          set -o pipefail
          PGPASSWORD=postgres psql -h localhost -U postgres -qc "create database lane_perf_test"
          PAPERBOAT_PERF_DATABASE_DSN="postgres://postgres:postgres@localhost:5432/lane_perf_test?sslmode=disable" \
            go test -json -count=1 -timeout 30m -run '^TestPerformanceBudgetsOnSeededPostgres$' ./internal/app |
            python3 ../tools/gotest-json.py --save "$GOTEST_EVENTS/perf.jsonl" --verbose
      - name: cli tests that need root (under sudo)
        if: matrix.module == 'cli' && !cancelled()
        run: |
          set -o pipefail
          run=(); v=(); [ -z "$RUN" ] || { run=(-run "$RUN"); v=(--verbose); }
          ../tools/cli-root-tests.sh -json "${run[@]}" | python3 ../tools/gotest-json.py --save "$GOTEST_EVENTS/root.jsonl" "${v[@]}"
      # The browser terminal drain check needs the machine side as a compiled test binary (built in cli, a separate
      # module); it skipped in every step here before. terminal-drain.yml runs the same pair on its own trigger.
      - name: browser terminal drain across updates (edge + machine)
        if: matrix.module == 'tunnel' && !cancelled() && (inputs.run == '' || contains(inputs.run, 'Drain'))
        env:
          PAPERBOAT_DRAIN_MACHINE_TEST_BINARY: ${{ runner.temp }}/drain-machine.test
        run: |
          set -o pipefail
          (cd ../cli && go test -c -o "$PAPERBOAT_DRAIN_MACHINE_TEST_BINARY" ./cmd/browserterminal-wasm)
          go test -json -race -count=1 -timeout 10m -run '^TestBrowserTerminalDrainAcrossUpdates$' ./internal/runtime |
            python3 ../tools/gotest-json.py --save "$GOTEST_EVENTS/drain.jsonl" --verbose
      # The Docker tunnel handover test builds its serving and replacement images from any local /bin/sh image.
      - name: docker tunnel handover (local fixture image)
        if: matrix.module == 'helper' && !cancelled() && (inputs.run == '' || contains(inputs.run, 'DockerTunnelInstall'))
        env:
          PAPERBOAT_TEST_DOCKER_BASE_IMAGE: alpine:3.21
        run: |
          set -o pipefail
          docker pull "$PAPERBOAT_TEST_DOCKER_BASE_IMAGE"
          go test -json -race -count=1 -timeout 10m -run '^TestDockerTunnelInstallHandsOverWithoutStoppingTheServingContainer$' ./internal/containers |
            python3 ../tools/gotest-json.py --save "$GOTEST_EVENTS/docker-handover.jsonl" --verbose
      - name: migration tests (each on its own empty database)
        if: matrix.module == 'server' && !cancelled()
        run: |
          set -o pipefail
          # These tests start from an empty database and leave it migrated, so each gets a fresh one.
          export PGPASSWORD=postgres
          tests=$(grep -l PAPERBOAT_MIGRATION_TEST_DATABASE_DSN internal/db/*_test.go | xargs grep -ho '^func Test[A-Za-z0-9_]*' | sed 's/^func //')
          [ -z "$RUN" ] || tests=$(grep -E -- "$RUN" <<<"$tests" || true)
          n=0 failed=0
          for t in $tests; do
            n=$((n + 1))
            psql -h localhost -U postgres -qc "create database lane_migration_${n}_test"
            PAPERBOAT_MIGRATION_TEST_DATABASE_DSN="postgres://postgres:postgres@localhost:5432/lane_migration_${n}_test?sslmode=disable&statement_timeout=600000" \
              go test -json -race -count=1 -run "^${t}\$" ./internal/db |
              python3 ../tools/gotest-json.py --save "$GOTEST_EVENTS/migrations.jsonl" || failed=1
          done
          exit $failed
      - name: keep go test events for the skip audit
        if: inputs.run == '' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gotest-events-${{ strategy.job-index }}
          path: gotest-events
          retention-days: 3
      - if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.paths.outputs.build }}
            ${{ steps.paths.outputs.mod }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  console:
    name: console check
    needs: plan
    if: needs.plan.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: console/package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  # The device harness's own unit tests (no devices, no network): a harness regression fails here, not on a device.
  smoke:
    name: device-smoke unittest
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tools/device-smoke -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tools/quick-update -p 'test_*.py' -v

  # The core end-to-end (e2e.yml core job): real server, two real pb daemons, a server restart.
  e2e:
    name: e2e
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      core_only: true

  sdk-macos:
    name: SDK macOS
    timeout-minutes: 15
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.go).*.module, 'sdk/go')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sdk/go
    env:
      RUN: ${{ inputs.run }}
      COUNT: ${{ inputs.count || '1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - run: go vet ./...
      - name: go test -race
        run: |
          run=(); [ -z "$RUN" ] || run=(-v -run "$RUN")
          go test -race -count="$COUNT" -timeout 10m "${run[@]}" ./...

  # No silent skips: a Go test that skipped in every step above (missing DSN, not root, no PgBouncer) and ran in
  # none fails the run, unless tools/skip-allowlist.txt names the job that runs it. tools/skip-baseline.txt holds
  # the ones known at the start and only shrinks. Full runs only: a narrowed
  # -run or module subset skips most tests by design.
  skip-audit:
    name: skip audit
    needs: go
    if: inputs.run == '' && inputs.modules == '' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gotest-events-*
          path: gotest-events
      - run: python3 tools/skip-audit.py tools/skip-allowlist.txt tools/skip-baseline.txt gotest-events/*/*.jsonl
