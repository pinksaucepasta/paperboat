name: CI

on:
  push:
    branches: [main]
    # Tracker and doc-only pushes start no CI (they queued behind each other, 2026-11-04).
    paths-ignore: ['CHECKLIST.md', 'PLAN.md', 'WHITEBOARD.md', 'docs/**/*.md', '**/README.md']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# On main the run in progress finishes and only the newest waiting push is kept (GitHub replaces an older pending
# run), so the queue stays one deep. Five worktrees pushing cancelled every main run before it ended (2026-11-09); other
# refs still supersede.
concurrency:
  group: ci-${{ github.repository }}-${{ github.event_name == 'push' && github.ref || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  server:
    name: Server checks
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            cli/go.sum
            relay/go.sum
            edge/go.sum
            helper/go.sum
            go.work.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml python3-cryptography
      - run: sudo apt-get install -y --no-install-recommends ripgrep
      - run: python3 -m unittest discover -s ../.github/tests -p 'test_*.py'
      - run: make check reproducible-builds binary-size-check static-analysis vulnerability-check license-check
      # The PostgreSQL suites (revoke, final delete, retention, reconcile ...) run here, each package on its own fresh
      # database (tools/pg-test-exec.sh). `make check` above runs without a DSN, so they skip there and run once, with -race.
      - name: go test -race (PostgreSQL suites included)
        env:
          PAPERBOAT_TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/lane_test?sslmode=disable&statement_timeout=600000
          GOTEST_EVENTS: ${{ github.workspace }}/gotest-events
        run: |
          set -o pipefail
          mkdir -p "$GOTEST_EVENTS"
          make race TESTFLAGS="-json -timeout 30m" |
            python3 ../tools/gotest-json.py --save "$GOTEST_EVENTS/server.jsonl"
      # A skipped PostgreSQL suite must not look green: these two named in the PR that added the service container.
      - name: PostgreSQL suites really ran
        run: |
          for t in TestRevokeMachineWithManyAccessSessionsOnPostgres TestWorkspaceEdgeSetPrefersNearestOnPostgres; do
            grep -- "\"Action\":\"pass\".*\"Test\":\"$t\"" ../gotest-events/server.jsonl || { echo "$t did not pass (skipped or missing)" >&2; exit 1; }
          done

  # max_pred_locks_per_transaction is restart-only and a service container cannot take server arguments, so this job
  # starts its own PostgreSQL with a tiny predicate-lock pool (pool = setting x (max_connections + 4 autovacuum + 8 workers
  # + max_wal_senders), so the 281 tables the test reads only overflow it with max_wal_senders=0: 10 x 22 = 220) (prod's filled in bursts and a revoke ran out, 2026-11-19).
  server-tiny-pool:
    name: Server tiny predicate-lock pool
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            cli/go.sum
            relay/go.sum
            edge/go.sum
            helper/go.sum
            go.work.sum
      - run: |
          docker run -d --name pg-tiny -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=lane_test postgres:17 \
            -c max_pred_locks_per_transaction=10 -c max_connections=10 -c max_wal_senders=0
          for i in $(seq 40); do docker exec pg-tiny pg_isready -U postgres -d lane_test && exit 0; sleep 2; done
          docker logs pg-tiny; exit 1
      - name: tiny predicate-lock pool test
        env:
          PAPERBOAT_TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/lane_test?sslmode=disable&statement_timeout=600000
        run: |
          set -o pipefail
          go test -race -count=1 -v -timeout 10m -run '^TestRevokeCompletesWhenThePredicateLockPoolIsSmallOnPostgres$' ./internal/usermachines | tee tiny.log
          grep -q -- '--- PASS: TestRevokeCompletesWhenThePredicateLockPoolIsSmallOnPostgres' tiny.log || { echo "the tiny-pool test skipped or did not run" >&2; exit 1; }

  modules:
    name: Vet and test ${{ matrix.module }}
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [shared, cli, relay, edge, helper]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            cli/go.sum
            relay/go.sum
            edge/go.sum
            helper/go.sum
            go.work.sum
      - run: sudo apt-get install -y --no-install-recommends ripgrep
      - run: ../tools/verify-source-policy.sh ${{ matrix.module }}
      - run: ../tools/verify-static-analysis.sh ${{ matrix.module }}
      - run: go vet ./...
      - run: go test ./...
      - name: cli tests that need root (under sudo)
        if: matrix.module == 'cli'
        run: ../tools/cli-root-tests.sh

  repository:
    name: Repository policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml python3-cryptography
      - run: python3 -m unittest discover -s tools -p test_pr_checks.py && python3 -m unittest discover -s tools -p test_push.py
      - run: python3 tools/check_domains.py && (cd tools && python3 -m unittest test_check_domains)
      - run: python3 tools/check_doc_links.py && (cd tools && python3 -m unittest test_check_doc_links)
      - run: cd tools && python3 -m unittest test_check_server_deployed
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: |
          d=$(ls server/internal/db/migrations | sed -n 's/^\([0-9][0-9]*\)_.*/\1/p' | sort | uniq -d)
          [ -z "$d" ] || { echo "duplicate migration numbers: $d"; exit 1; }
      - run: python3 -m unittest discover -s tools/probe -p 'test_*.py' && bash tools/probe/test_probe.sh
      - run: cd tools && python3 -m unittest test_progress

  console:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: console, name: Console lint and types }
          - { app: admin, name: Admin lint and types }
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ${{ matrix.app }}/package.json
      - run: bun install --frozen-lockfile
      # Generated code must match its source: the API types come from server/docs/openapi.json (sqlc output
      # is checked by make generate-check in the server job).
      - run: |
          bun run api:types
          git diff --exit-code -- lib/api-schema.d.ts || { echo "${{ matrix.app }}/lib/api-schema.d.ts is stale, run bun run api:types" >&2; exit 1; }
      - run: bun run lint
      - run: bunx next typegen
      - run: bunx tsc --noEmit
