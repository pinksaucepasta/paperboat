name: CI

on:
  push:
    branches: [main]
    # Tracker and doc-only pushes start no CI (they queued behind each other, 2026-11-04).
    paths-ignore: ['CHECKLIST.md', 'PLAN.md', 'WHITEBOARD.md', 'docs/**/*.md', '**/README.md']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# On main the run in progress finishes and only the newest waiting push is kept (GitHub replaces an older pending
# run), so the queue stays one deep. Five lanes pushing cancelled every main run before it ended (2026-11-09); other
# refs still supersede.
concurrency:
  group: ci-${{ github.repository }}-${{ github.event_name == 'push' && github.ref || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  server:
    name: Server checks
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            cli/go.sum
            relay/go.sum
            edge/go.sum
            helper/go.sum
            go.work.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml python3-cryptography
      - run: python3 -m unittest discover -s ../.github/tests -p 'test_*.py'
      - run: make check race reproducible-builds binary-size-check static-analysis vulnerability-check license-check

  modules:
    name: Vet and test ${{ matrix.module }}
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [shared, cli, relay, edge, helper]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            cli/go.sum
            relay/go.sum
            edge/go.sum
            helper/go.sum
            go.work.sum
      - run: go vet ./...
      - run: go test ./...
      - name: cli tests that need root (under sudo)
        if: matrix.module == 'cli'
        run: ../tools/cli-root-tests.sh

  repository:
    name: Repository policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml python3-cryptography
      - run: python3 -m unittest discover -s tools -p test_pr_checks.py && python3 -m unittest discover -s tools -p test_push.py
      - run: python3 tools/check_domains.py && (cd tools && python3 -m unittest test_check_domains)
      - run: python3 tools/check_doc_links.py && (cd tools && python3 -m unittest test_check_doc_links)
      - run: cd tools && python3 -m unittest test_check_server_deployed
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: |
          d=$(ls server/internal/db/migrations | sed -n 's/^\([0-9][0-9]*\)_.*/\1/p' | sort | uniq -d)
          [ -z "$d" ] || { echo "duplicate migration numbers: $d"; exit 1; }
      - run: python3 -m unittest discover -s tools/probe -p 'test_*.py' && bash tools/probe/test_probe.sh
      - run: cd tools && python3 -m unittest test_progress

  console:
    name: Console lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: console/package.json
      - run: bun install --frozen-lockfile
      # Generated code must match its source: the API types come from server/docs/openapi.json (sqlc output
      # is checked by make generate-check in the server job).
      - run: |
          bun run api:types
          git diff --exit-code -- lib/api-schema.d.ts || { echo "console/lib/api-schema.d.ts is stale, run bun run api:types" >&2; exit 1; }
      - run: bun run lint
      - run: bunx next typegen
      - run: bunx tsc --noEmit
