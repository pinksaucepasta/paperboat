name: PR checks
on:
  pull_request:
  merge_group:
  # A push to main warms the Go build and module cache: PR and queue runs read caches saved on main only,
  # and a job that is cancelled never saves its own, so every run started cold (2026-11-11).
  push:
    branches: [main]
    # Only a changed dependency set needs fresh caches (setup-go keys them on go.sum); every other main push would run this job for nothing.
    paths: ['**/go.sum', '**/go.mod', 'go.work', 'go.work.sum', '.github/workflows/pr-checks.yml']
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  targeted:
    name: Targeted Go checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # A cold cache compiles every importer with -race: PRs #3 and #5 were cut off at 5 minutes while still compiling.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paperboat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PAPERBOAT_TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/paperboat_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: '**/go.sum'
      - run: python3 tools/pr-checks.py '${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}'

  warm:
    name: Warm Go caches
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: '**/go.sum'
      # Compile what the targeted job compiles (vet, and the -race test binaries) without running a test.
      - run: |
          for module in shared server cli relay tunnel helper sdk/go; do
            (cd "$module" && go vet ./... && go test -race -count=1 -run '^$' ./...)
          done
