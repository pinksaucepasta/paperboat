name: Cross-platform

# Build and test the cli and shared modules on the platforms users run (macOS, Windows).
# macOS must be green. Windows is post-launch (PLAN 1.1) and still has a known backlog, so its job
# reports but does not fail the workflow; remove continue-on-error once it is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to test (default all), for example ./internal/hostruntime/hostdproto
        default: ./...
      run:
        description: Only tests matching this regular expression
        default: ''
      count:
        description: Repeat each test this many times (go test -count)
        default: '1'

permissions:
  contents: read

# Every lane pushes to main many times an hour and a run takes 30+ minutes, so runs queued behind each
# other for hours. One run per ref executes at a time and only the newest waiting push is kept (GitHub
# replaces an older pending run); the run in progress always finishes, so a run is never starved by
# later pushes. A hand dispatch has its own group.
concurrency:
  group: cross-platform-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.module }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        module: [shared, cli]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: |
            cli/go.sum
            shared/go.sum
            go.work.sum
      # windows-latest exports TEMP as an 8.3 short path (C:\Users\RUNNER~1\...). The credential and
      # state stores refuse a path that resolves to a different name, as designed, so every test that
      # keeps its fixtures under TEMP failed on that alone. Use the real path the runner provides.
      - name: Use the long temp path
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet ./...
      # Runs even when vet fails so one run reports every problem.
      - name: Tests with the race detector
        if: ${{ !cancelled() }}
        env:
          # A package list given by hand names cli packages.
          PACKAGES: ${{ (matrix.module == 'cli' && inputs.packages) || './...' }}
          RUN: ${{ inputs.run }}
          COUNT: ${{ inputs.count || '1' }}
        run: go test -race -timeout 15m -count "$COUNT" ${RUN:+-run "$RUN"} $PACKAGES
