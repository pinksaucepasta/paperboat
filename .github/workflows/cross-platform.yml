name: Cross-platform

# Build and test the cli, shared and Go SDK modules on macOS (Linux has its own lanes), and the device-smoke harness's
# Python unit tests on every push to main. Windows is post-launch (PLAN 1.1).
on:
  push:
    branches: [main]
    # Tracker and doc-only pushes start no CI (they queued behind each other, 2026-11-04).
    paths-ignore: ['CHECKLIST.md', 'PLAN.md', 'WHITEBOARD.md', 'docs/**/*.md', '**/README.md']
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to test (default all), for example ./internal/hostruntime/hostdproto
        default: ./...
      run:
        description: Only tests matching this regular expression
        default: ''
      count:
        description: Repeat each test this many times (go test -count)
        default: '1'

permissions:
  contents: read

# Every lane pushes to main many times an hour and a run takes 30+ minutes, so runs queued behind each
# other for hours. One run per ref executes at a time and only the newest waiting push is kept (GitHub
# replaces an older pending run); the run in progress always finishes, so a run is never starved by
# later pushes. A hand dispatch has its own group.
concurrency:
  group: cross-platform-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.module }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        module: [shared, cli, sdk/go]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: |
            cli/go.sum
            shared/go.sum
            sdk/go/go.sum
            go.work.sum
      - run: go build ./...
      - run: go vet ./...
      # Runs even when vet fails so one run reports every problem.
      - name: Tests with the race detector
        if: ${{ !cancelled() }}
        env:
          # A package list given by hand names cli packages.
          PACKAGES: ${{ (matrix.module == 'cli' && inputs.packages) || './...' }}
          RUN: ${{ inputs.run }}
          COUNT: ${{ inputs.count || '1' }}
        run: go test -race -timeout 15m -count "$COUNT" ${RUN:+-run "$RUN"} $PACKAGES

  # The device harness's own unit tests (no devices, no network), as lane-test's smoke job: a harness
  # regression fails the push that brings it, not the next device run.
  smoke:
    name: device-smoke unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tools/device-smoke -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tools/quick-update -p 'test_*.py' -v
