name: Cross-platform

# Build and test the cli, shared and Go SDK modules on macOS and Windows (Linux has its own lanes), and the
# device-smoke harness's Python unit tests on every push to main (not on pull requests: its macOS and Windows
# jobs held every hosted runner slot and kept the required PR checks queued for 7+ minutes, 2026-11-11). Windows runs without the race detector (slow
# there); the Linux and macOS jobs carry it.
on:
  push:
    branches: [main]
    # Tracker and doc-only pushes start no CI (they queued behind each other, 2026-11-04).
    paths-ignore: ['CHECKLIST.md', 'PLAN.md', 'WHITEBOARD.md', 'docs/**/*.md', '**/README.md']
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to test (default all), for example ./internal/hostruntime/hostdproto
        default: ./...
      run:
        description: Only tests matching this regular expression
        default: ''
      count:
        description: Repeat each test this many times (go test -count)
        default: '1'

permissions:
  contents: read

# Every lane pushes to main many times an hour and a run takes 30+ minutes, so runs queued behind each
# other for hours. One run per ref executes at a time and only the newest waiting push is kept (GitHub
# replaces an older pending run); the run in progress always finishes, so a run is never starved by
# later pushes. A hand dispatch has its own group.
concurrency:
  group: cross-platform-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.module }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        module: [shared, cli, sdk/go]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: |
            cli/go.sum
            shared/go.sum
            sdk/go/go.sum
            go.work.sum
      - run: go build ./...
      - run: go vet ./...
      # Runs even when vet fails so one run reports every problem.
      - name: Tests
        if: ${{ !cancelled() }}
        env:
          # A package list given by hand names cli packages.
          PACKAGES: ${{ (matrix.module == 'cli' && inputs.packages) || './...' }}
          # A narrowed run is -v, so its log shows each test that ran (--- PASS).
          RUN: ${{ inputs.run }}
          COUNT: ${{ inputs.count || '1' }}
          RACE: ${{ matrix.os != 'windows-latest' && '-race' || '' }}
        run: |
          if [ "$RUNNER_OS" != Windows ]; then
            go test $RACE -timeout 15m -count "$COUNT" ${RUN:+-v -run "$RUN"} $PACKAGES
            exit
          fi
          # The runner is an elevated administrator, so what a test creates is owned by Administrators, which the
          # credential and lock checks refuse. win-test-exec runs each test binary with an unelevated token and a
          # private TEMP/APPDATA root that token owns. The tests in elevated_tests.txt need Administrators/SYSTEM
          # ownership and run second, elevated (still in the private root).
          (cd "$GITHUB_WORKSPACE/cli" && go build -o "$RUNNER_TEMP/win-test-exec.exe" ./tools/win-test-exec)
          ELEVATED=$(grep -v '^#' "$GITHUB_WORKSPACE/cli/tools/win-test-exec/elevated_tests.txt" | grep . | paste -sd'|')
          status=0
          go test -exec "$RUNNER_TEMP/win-test-exec.exe" -skip "^($ELEVATED)\$" -timeout 15m -count "$COUNT" ${RUN:+-v -run "$RUN"} $PACKAGES || status=1
          go test -exec "$RUNNER_TEMP/win-test-exec.exe -elevated" ${RUN:+-v} -run "^($ELEVATED)\$" -timeout 15m -count "$COUNT" $PACKAGES || status=1
          exit $status

  # The device harness's own unit tests (no devices, no network), as lane-test's smoke job: a harness
  # regression fails the push that brings it, not the next device run.
  smoke:
    name: device-smoke unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tools/device-smoke -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tools/quick-update -p 'test_*.py' -v
