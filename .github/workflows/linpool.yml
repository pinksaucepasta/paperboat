# Temporary Linux test hosts: each job is a hosted runner kept alive for hours, with Go, gcc and a postgres:17 service
# container ready, whose sshd the controller reaches through a reverse SSH tunnel to our jump host's loopback
# (tools/device-smoke/linpool.sh starts, lists and stops them; tools/remote-test.sh linpool-N runs suites on them).
# Same design as winpool.yml and macpool.yml and the same tunnel secrets. Manual dispatch only, so a fork or pull
# request can never run it with the tunnel key.
name: linpool

on:
  workflow_dispatch:
    inputs:
      slots:
        description: Host numbers 1-12, comma separated (linpool.sh start picks free ones)
        required: true
        default: "1"
      hours:
        description: Lifetime in hours
        type: choice
        options: ["1", "2", "3", "4", "5"]
        default: "2"

permissions: {} # no checkout, no token use

jobs:
  host:
    name: linpool-${{ matrix.slot }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON('{"1":75,"2":135,"3":195,"4":255,"5":315}')[inputs.hours] }} # hours + 15 min, under GitHub's 6 h cap
    concurrency: linpool-${{ matrix.slot }} # one host per tunnel port
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(format('[{0}]', inputs.slots)) }}
    services:
      postgres: # as in e2e.yml; the throwaway password only protects a loopback container that dies with the job
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.4
          cache: false
      - name: what tools/remote-test.sh expects
        run: |
          set -euo pipefail
          mkdir -p ~/.local && ln -sfn "$(go env GOROOT)" ~/.local/go1.27.4
          for tool in gcc rsync psql; do command -v $tool >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq gcc rsync postgresql-client; break; }; done
          (umask 077; echo 'postgres://postgres:postgres@127.0.0.1:5432/lane_test?sslmode=disable' > ~/.pb-test-pg-dsn)
          psql "$(cat ~/.pb-test-pg-dsn)" -qc 'select 1' >/dev/null
      - name: sshd behind a reverse tunnel
        env:
          SLOT: ${{ matrix.slot }}
          HOURS: ${{ inputs.hours }}
          CONTROLLER_PUBKEY: ${{ vars.WINPOOL_CONTROLLER_PUBKEY }}
          TUNNEL_KEY: ${{ secrets.WINPOOL_TUNNEL_KEY }}
          TUNNEL_HOST: ${{ secrets.WINPOOL_TUNNEL_HOST }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.WINPOOL_TUNNEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ $SLOT =~ ^([1-9]|1[0-2])$ ]] || { echo 'slot must be 1-12'; exit 1; }
          [ -n "$CONTROLLER_PUBKEY" ] && [ -n "$TUNNEL_KEY" ] || { echo 'WINPOOL_CONTROLLER_PUBKEY or WINPOOL_TUNNEL_KEY is not set'; exit 1; }
          port=$((22400 + SLOT))

          # Our own sshd, not the image's: loopback only and keys only, whatever the image configures.
          dir=$RUNNER_TEMP/linpool-sshd; mkdir -p "$dir"
          ssh-keygen -q -t ed25519 -N '' -f "$dir/host_ed25519"
          cat > "$dir/sshd_config" <<CONF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $dir/host_ed25519
          PidFile $dir/sshd.pid
          AuthenticationMethods publickey
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AllowUsers $USER
          UsePAM yes
          Subsystem sftp /usr/lib/openssh/sftp-server
          CONF
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CONTROLLER_PUBKEY" > ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo mkdir -p /run/sshd
          effective=$(sudo /usr/sbin/sshd -T -f "$dir/sshd_config")
          [ "$(grep -c '^listenaddress ' <<<"$effective")" = 1 ] && grep -qx 'listenaddress 127.0.0.1:2222' <<<"$effective" &&
            grep -qx 'passwordauthentication no' <<<"$effective" && grep -qx 'kbdinteractiveauthentication no' <<<"$effective" ||
            { echo "sshd would listen beyond loopback or accept passwords:"; grep -E '^(listenaddress|passwordauthentication|kbdinteractiveauthentication|port) ' <<<"$effective"; exit 1; }
          sudo /usr/sbin/sshd -f "$dir/sshd_config" # forks into the background

          key=~/.ssh/linpool_tunnel; known=~/.ssh/linpool_known_hosts
          (umask 077; printf '%s\n' "$TUNNEL_KEY" | tr -d '\r' > "$key")
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$known"
          stop=/tmp/linpool-stop # linpool.sh stop creates it
          deadline=$((SECONDS + HOURS * 3600))
          running() { [ $SECONDS -lt $deadline ] && [ ! -e "$stop" ]; }
          trap 'rm -f "$key"; sudo kill "$(cat "$dir/sshd.pid")" 2>/dev/null || true' EXIT
          while running; do
            ssh -N -T -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known" -o ExitOnForwardFailure=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              -R "127.0.0.1:${port}:127.0.0.1:2222" "winpool@$TUNNEL_HOST" &
            tunnel=$!
            echo "linpool-$SLOT is up"
            while running && kill -0 "$tunnel" 2>/dev/null; do sleep 5; done
            if kill -0 "$tunnel" 2>/dev/null; then kill "$tunnel"; else echo 'tunnel closed; again in 10 s'; sleep 10; fi
            wait "$tunnel" 2>/dev/null || true
          done
