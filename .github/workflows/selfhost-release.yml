name: Self-host installer

# Publishes the `pbh` self-host one-liner for an existing release tag. Manual, and only after
# "Service containers" has published the relay and tunnel images for the same tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable release tag whose relay and tunnel images are already published'
        required: true
        type: string

run-name: Self-host installer ${{ inputs.release_tag }}

concurrency:
  group: paperboat-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.release_tag }}

jobs:
  publish:
    name: Build, publish and verify the self-host installer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: paperboat-tuf-published
    env:
      RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
      RELEASE_HOST: ${{ vars.PAPERBOAT_RELEASE_HOST }}
      DOCKER_INSTALL_URL: ${{ vars.PAPERBOAT_DOCKER_INSTALL_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helper/go.mod
          cache: true
          cache-dependency-path: helper/go.sum
      - name: Validate the release tag and protected endpoints
        id: endpoints
        shell: bash
        run: |
          set -euo pipefail
          ./cli/tools/release-version.sh validate-format "$RELEASE_VERSION"
          tag_ref="refs/tags/$RELEASE_VERSION"
          source_sha=$(git ls-remote origin "$tag_ref" "$tag_ref^{}" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { commit=$1 } END { print peeled ? peeled : commit }')
          test -n "$source_sha" && test "$(git rev-parse HEAD)" = "$source_sha"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          from urllib.parse import urlsplit
          release = urlsplit(os.environ.get('RELEASE_URL', ''))
          if release.scheme != 'https' or not release.hostname or release.path != '/tuf' or release.port not in (None, 443) or release.username or release.query or release.fragment:
              raise SystemExit('PAPERBOAT_DEFAULT_RELEASE_URL must be https://HOST/tuf')
          docker = urlsplit(os.environ.get('DOCKER_INSTALL_URL', ''))
          if docker.scheme != 'https' or not docker.hostname or docker.username or docker.query or docker.fragment:
              raise SystemExit('PAPERBOAT_DOCKER_INSTALL_URL must be the official https Docker installer URL')
          host = os.environ.get('RELEASE_HOST', '')
          if not re.fullmatch(r'[A-Za-z0-9.-]+', host):
              raise SystemExit('PAPERBOAT_RELEASE_HOST must be a canonical SSH host name or IPv4 address')
          print(f'origin=https://{release.hostname.lower()}')
          PY
      - name: Require multi-architecture relay and tunnel images for this tag
        shell: bash
        run: |
          set -euo pipefail
          for service in relay tunnel; do
            docker buildx imagetools inspect "ghcr.io/$GITHUB_REPOSITORY/$service:$RELEASE_VERSION" --raw > "$RUNNER_TEMP/$service.json"
            python3 - "$RUNNER_TEMP/$service.json" "$service" <<'PY'
          import json, sys
          index = json.load(open(sys.argv[1]))
          platforms = {(m['platform']['os'], m['platform']['architecture']) for m in index.get('manifests', []) if 'platform' in m}
          if not {('linux', 'amd64'), ('linux', 'arm64')} <= platforms:
              raise SystemExit(f'{sys.argv[2]} image is not published for linux/amd64 and linux/arm64')
          PY
          done
      - name: Build both packages and render the installer
        id: build
        env:
          ORIGIN: ${{ steps.endpoints.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          export PAPERBOAT_SELFHOST_ADDRESS_URL="$ORIGIN/selfhost/address"
          export PAPERBOAT_SELFHOST_RELAY_IMAGE="ghcr.io/$GITHUB_REPOSITORY/relay:$RELEASE_VERSION"
          export PAPERBOAT_SELFHOST_TUNNEL_IMAGE="ghcr.io/$GITHUB_REPOSITORY/tunnel:$RELEASE_VERSION"
          out="$GITHUB_WORKSPACE/.build/selfhost"
          for arch in amd64 arm64; do helper/deploy/package-selfhost.sh "$RELEASE_VERSION" "$arch" "$out"; done
          helper/deploy/render-installer.sh "$RELEASE_VERSION" "$ORIGIN/selfhost/versions/$RELEASE_VERSION" "$DOCKER_INSTALL_URL" "$out"
          tar -czf "$RUNNER_TEMP/selfhost-bundle.tgz" -C "$out" install manifest.json paperboat-selfhost-linux-amd64.tar.gz paperboat-selfhost-linux-arm64.tar.gz
          echo "digest=$(sha256sum "$RUNNER_TEMP/selfhost-bundle.tgz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Publish to the protected origin
        env:
          PAPERBOAT_RELEASE_SSH_KEY: ${{ secrets.PAPERBOAT_RELEASE_SSH_KEY }}
          PAPERBOAT_RELEASE_KNOWN_HOSTS: ${{ secrets.PAPERBOAT_RELEASE_KNOWN_HOSTS }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAPERBOAT_RELEASE_SSH_KEY" && test -n "$PAPERBOAT_RELEASE_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PAPERBOAT_RELEASE_SSH_KEY" > "$HOME/.ssh/paperboat-release"
          printf '%s\n' "$PAPERBOAT_RELEASE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/paperboat-release" "$HOME/.ssh/known_hosts"
          ssh_options=(-i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote_bundle="/opt/paperboat/releases/staging/paperboat-selfhost-$RELEASE_VERSION-$GITHUB_RUN_ID.tgz"
          remote_script="/opt/paperboat/releases/staging/publish-selfhost-origin-$GITHUB_RUN_ID.sh"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/selfhost-bundle.tgz" "root@$RELEASE_HOST:$remote_bundle"
          scp "${ssh_options[@]}" helper/deploy/publish-selfhost-origin.sh "root@$RELEASE_HOST:$remote_script"
          # shellcheck disable=SC2029 # the paths and digest are validated and must expand here
          ssh "${ssh_options[@]}" "root@$RELEASE_HOST" "trap 'rm -f -- $remote_bundle $remote_script' EXIT; bash $remote_script $remote_bundle /opt/paperboat/releases $RELEASE_VERSION $DIGEST"
      - name: Verify the public one-liner serves exactly what was published
        env:
          ORIGIN: ${{ steps.endpoints.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.build/selfhost"
          curl --fail --silent --show-error --proto '=https' --max-time 30 "$ORIGIN/selfhost/install" -o "$RUNNER_TEMP/served-install"
          cmp "$RUNNER_TEMP/served-install" "$out/install"
          for arch in amd64 arm64; do
            curl --fail --silent --show-error --proto '=https' --max-time 120 "$ORIGIN/selfhost/versions/$RELEASE_VERSION/paperboat-selfhost-linux-$arch.tar.gz" -o "$RUNNER_TEMP/served-$arch.tar.gz"
            cmp "$RUNNER_TEMP/served-$arch.tar.gz" "$out/paperboat-selfhost-linux-$arch.tar.gz"
          done
