name: Self-host installer

# Publishes the `pbh` self-host packages for an existing release tag as a signed GitHub release `selfhost-<tag>` (never
# marked Latest: that is the CLI's). The fixed helper/deploy/install.sh finds the newest one. Manual, and only after
# "Service containers" has published the relay and edge images for the same tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable release tag whose relay and edge images are already published'
        required: true
        type: string

run-name: Self-host installer ${{ inputs.release_tag }}

concurrency:
  group: paperboat-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.release_tag }}

jobs:
  publish:
    name: Build, sign and publish the self-host packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: paperboat-tuf-published
    permissions:
      contents: write
    env:
      RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
      RELEASE_HOST: ${{ vars.PAPERBOAT_RELEASE_HOST }}
      PAPERBOAT_TUF_CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helper/go.mod
          cache: true
          cache-dependency-path: |
            helper/go.sum
            cli/go.sum
      - name: Validate the release tag and protected endpoints
        id: endpoints
        shell: bash
        run: |
          set -euo pipefail
          ./tools/release-version.sh validate-format "$RELEASE_VERSION"
          tag_ref="refs/tags/$RELEASE_VERSION"
          source_sha=$(git ls-remote origin "$tag_ref" "$tag_ref^{}" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { commit=$1 } END { print peeled ? peeled : commit }')
          test -n "$source_sha" && test "$(git rev-parse HEAD)" = "$source_sha"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          from urllib.parse import urlsplit
          release = urlsplit(os.environ.get('RELEASE_URL', ''))
          if release.scheme != 'https' or not release.hostname or release.path != '/tuf' or release.port not in (None, 443) or release.username or release.query or release.fragment:
              raise SystemExit('PAPERBOAT_DEFAULT_RELEASE_URL must be https://HOST/tuf')
          print(f'origin=https://{release.hostname.lower()}')
          PY
      - name: Require multi-architecture relay and edge images for this tag
        shell: bash
        run: |
          set -euo pipefail
          for service in relay edge; do
            docker buildx imagetools inspect "ghcr.io/$GITHUB_REPOSITORY/$service:$RELEASE_VERSION" --raw > "$RUNNER_TEMP/$service.json"
            python3 - "$RUNNER_TEMP/$service.json" "$service" <<'PY'
          import json, sys
          index = json.load(open(sys.argv[1]))
          platforms = {(m['platform']['os'], m['platform']['architecture']) for m in index.get('manifests', []) if 'platform' in m}
          if not {('linux', 'amd64'), ('linux', 'arm64')} <= platforms:
              raise SystemExit(f'{sys.argv[2]} image is not published for linux/amd64 and linux/arm64')
          PY
          done
      - name: Build both packages
        id: build
        env:
          ORIGIN: ${{ steps.endpoints.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          export PAPERBOAT_SELFHOST_ADDRESS_URL="$ORIGIN/selfhost/address"
          export PAPERBOAT_SELFHOST_RELAY_IMAGE="ghcr.io/$GITHUB_REPOSITORY/relay:$RELEASE_VERSION"
          export PAPERBOAT_SELFHOST_EDGE_IMAGE="ghcr.io/$GITHUB_REPOSITORY/edge:$RELEASE_VERSION"
          out="$GITHUB_WORKSPACE/.build/selfhost"
          for arch in amd64 arm64; do helper/deploy/package-selfhost.sh "$RELEASE_VERSION" "$arch" "$out"; done
      - name: Sign SHA256SUMS with the release key
        env:
          PAPERBOAT_RELEASE_SIGNING_KEY: ${{ secrets.PAPERBOAT_RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAPERBOAT_RELEASE_SIGNING_KEY"
          key="$RUNNER_TEMP/release-signing-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$PAPERBOAT_RELEASE_SIGNING_KEY" > "$key")
          # Refuses a release the embedded key in the installer cannot verify.
          sh cli/tools/sign-release-assets.sh "$GITHUB_WORKSPACE/.build/selfhost" "selfhost-$RELEASE_VERSION" "$key" helper/deploy/install.sh
          rm -f "$key"
      - name: Publish the signed GitHub release (never Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.build/selfhost"
          tag="selfhost-$RELEASE_VERSION"
          source_sha=$(git rev-parse HEAD)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # An immutable release is never changed: re-running is fine only when every byte is identical.
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/existing.json"
            python3 - "$RUNNER_TEMP/existing.json" "$out" <<'PY'
          import hashlib, json, pathlib, sys
          assets = {a['name']: a for a in json.load(open(sys.argv[1]))['assets']}
          files = {p.name: p for p in pathlib.Path(sys.argv[2]).iterdir() if p.is_file()}
          if set(assets) != set(files):
              raise SystemExit(f'published self-host release has assets {sorted(assets)}, expected {sorted(files)}')
          for name, path in files.items():
              if assets[name].get('digest') != 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest():
                  raise SystemExit(f'published self-host asset differs from this build: {name}')
          PY
            echo "$tag is already published with identical bytes."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$source_sha" --title "Paperboat self-host $RELEASE_VERSION" \
              --notes "Self-host packages for release $RELEASE_VERSION; installed by the fixed helper/deploy/install.sh." --latest=false --draft
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$out"/*
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
      - name: Verify the public release serves exactly what was built
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.build/selfhost"
          tag="selfhost-$RELEASE_VERSION"
          for file in "$out"/*; do
            curl --fail --silent --show-error --location --proto '=https' --max-time 120 "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$file")" -o "$RUNNER_TEMP/served"
            cmp "$RUNNER_TEMP/served" "$file"
          done
          # The installer verifies this public copy with the key it embeds: prove it will.
          grep -o 'paperboat-release namespaces="paperboat-release" ssh-ed25519 [A-Za-z0-9+/=]*' helper/deploy/install.sh | head -n 1 > "$RUNNER_TEMP/allowed_signers"
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/SHA256SUMS" -o "$RUNNER_TEMP/public-SHA256SUMS"
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/SHA256SUMS.sig" -o "$RUNNER_TEMP/public-SHA256SUMS.sig"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I paperboat-release -n paperboat-release -s "$RUNNER_TEMP/public-SHA256SUMS.sig" < "$RUNNER_TEMP/public-SHA256SUMS" > /dev/null
          test "$(sed -n 1p "$RUNNER_TEMP/public-SHA256SUMS")" = "# paperboat-release $tag"
          # The CLI installer follows /releases/latest: this release must not have taken it over.
          latest=$(curl --silent --location --head --output /dev/null --write-out '%{url_effective}' "https://github.com/$GITHUB_REPOSITORY/releases/latest")
          case "$latest" in */releases/tag/selfhost-*) echo "$tag became the Latest release" >&2; exit 1 ;; esac
      - name: Sign the packages into the TUF targets and publish the metadata to the origin
        # pbh's Update verifies the bundle against these targets with the same root pb update trusts.
        env:
          PAPERBOAT_TUF_ONLINE_KEY: ${{ secrets.PAPERBOAT_TUF_ONLINE_KEY }}
          PAPERBOAT_RELEASE_SSH_KEY: ${{ secrets.PAPERBOAT_RELEASE_SSH_KEY }}
          PAPERBOAT_RELEASE_KNOWN_HOSTS: ${{ secrets.PAPERBOAT_RELEASE_KNOWN_HOSTS }}
          PAPERBOAT_GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          for name in PAPERBOAT_TUF_ONLINE_KEY PAPERBOAT_RELEASE_SSH_KEY PAPERBOAT_RELEASE_KNOWN_HOSTS RELEASE_HOST; do
            test -n "${!name}" || { echo "$name is required" >&2; exit 1; }
          done
          case "$RELEASE_HOST" in */*|*:*|*' '*) echo 'PAPERBOAT_RELEASE_HOST must be a canonical SSH host name or IPv4 address' >&2; exit 1 ;; esac
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PAPERBOAT_RELEASE_SSH_KEY" > "$HOME/.ssh/paperboat-release"
          printf '%s\n' "$PAPERBOAT_RELEASE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/paperboat-release" "$HOME/.ssh/known_hosts"
          remote() { ssh -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$RELEASE_HOST" "$@"; }
          out="$GITHUB_WORKSPACE/.build/selfhost"
          repository="$RUNNER_TEMP/tuf-selfhost"
          mkdir -p "$repository/targets"
          remote 'tar -C /opt/paperboat/releases/current/tuf -cf - metadata' | tar -C "$repository" -xf -
          go run ./tools/tuf-repository validate-signers -repository "$repository" \
            -trusted-root "$GITHUB_WORKSPACE/shared/tufroot/trusted-root.json"
          go run ./tools/tuf-repository verify-published -repository "$repository"
          # A re-run after a successful publication finds the same bundle already signed and changes nothing.
          if python3 - "$repository/metadata/targets.json" "$out" "$RELEASE_VERSION" "$GITHUB_REPOSITORY" <<'PY'
          import hashlib, json, pathlib, sys
          targets = json.loads(pathlib.Path(sys.argv[1]).read_text())['signed']['targets']
          for arch in ('amd64', 'arm64'):
              file = pathlib.Path(sys.argv[2]) / f'paperboat-selfhost-linux-{arch}.tar.gz'
              target = targets.get(f'selfhost/{sys.argv[3]}/{file.name}')
              url = f'https://github.com/{sys.argv[4]}/releases/download/selfhost-{sys.argv[3]}/{file.name}'
              if not target or target['hashes']['sha256'] != hashlib.sha256(file.read_bytes()).hexdigest() or target['length'] != file.stat().st_size or target.get('custom') != {'repository': sys.argv[4], 'url': url}:
                  raise SystemExit(1)
          PY
          then
            echo "selfhost/$RELEASE_VERSION is already signed with identical bytes."
            exit 0
          fi
          go run ./tools/tuf-repository add-selfhost -repository "$repository" -version "$RELEASE_VERSION" -artifacts "$out"
          go run ./tools/tuf-repository verify-published -repository "$repository"
          staged="$RUNNER_TEMP/tuf-selfhost-origin"
          mkdir -p "$staged"
          remote 'tar -C /opt/paperboat/releases/current -cf - tuf' | tar -C "$staged" -xf -
          rm -rf "$staged/tuf/metadata"
          cp -R "$repository/metadata" "$staged/tuf/metadata"
          bundle="$RUNNER_TEMP/paperboat-tuf-selfhost-$RELEASE_VERSION.tgz"
          tar -C "$staged" -czf "$bundle" tuf
          digest=$(sha256sum "$bundle" | awk '{print $1}')
          remote_bundle="/opt/paperboat/releases/staging/paperboat-tuf-selfhost-$RELEASE_VERSION-$GITHUB_RUN_ID.tgz"
          remote_script="/opt/paperboat/releases/staging/publish-tuf-origin-selfhost-$GITHUB_RUN_ID.sh"
          scp -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "$bundle" "root@$RELEASE_HOST:$remote_bundle"
          scp -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes tools/publish-tuf-origin.sh "root@$RELEASE_HOST:$remote_script"
          remote "chmod 0700 '$remote_script' && '$remote_script' '$remote_bundle' /opt/paperboat/releases '$RELEASE_VERSION' '$digest'"
      - name: Verify the public TUF targets name both packages
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 30 --max-filesize 1048576 \
            --header 'Cache-Control: no-cache' "$RELEASE_URL/metadata/targets.json" -o "$RUNNER_TEMP/public-targets.json"
          python3 - "$RUNNER_TEMP/public-targets.json" "$GITHUB_WORKSPACE/.build/selfhost" "$RELEASE_VERSION" "$GITHUB_REPOSITORY" <<'PY'
          import hashlib, json, pathlib, sys
          targets = json.loads(pathlib.Path(sys.argv[1]).read_text())['signed']['targets']
          for arch in ('amd64', 'arm64'):
              file = pathlib.Path(sys.argv[2]) / f'paperboat-selfhost-linux-{arch}.tar.gz'
              target = targets.get(f'selfhost/{sys.argv[3]}/{file.name}')
              if not target or target['hashes']['sha256'] != hashlib.sha256(file.read_bytes()).hexdigest() or target['length'] != file.stat().st_size:
                  raise SystemExit(f'public TUF targets do not sign {file.name} of {sys.argv[3]}')
              if target['custom']['url'] != f'https://github.com/{sys.argv[4]}/releases/download/selfhost-{sys.argv[3]}/{file.name}':
                  raise SystemExit(f'public TUF target for {file.name} names the wrong download URL')
          PY
