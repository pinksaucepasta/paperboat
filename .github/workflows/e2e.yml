name: End-to-end

# Core end-to-end (server/internal/app TestE2ECore): the real server on PostgreSQL, the real edge and relay, and two
# real pb daemons in systemd containers: exec both ways, managed SSH, a file send, a preview and a tunnel through the
# edge; a server restart and an edge restart like deploys, all of it again each time; exec through the relay only.
# Required check `End-to-end core` (tools/branch-protection.json): merge_group and explicit test runs.
# Before a push: tools/ci-test.sh e2e. On pull_request its jobs are skipped (reported as passed): two
# 30-minute jobs per PR filled the hosted runners and queued the required checks for 10+ minutes (2026-11-12). The multi job (tools/e2e/run.sh) is not required
# and runs only on r21-e2e* pushes and dispatch.
on:
  push:
    # Not main: the merge queue ran End-to-end core on exactly these commits before they landed.
    branches: ['r21-e2e*']
    paths:
      - 'server/**'
      - 'edge/**'
      - 'relay/**'
      - 'shared/**'
      - 'helper/**'
      - 'cli/**'
      - 'go.work'
      - 'go.work.sum'
      - 'tools/e2e/**'
      - '.github/workflows/e2e.yml'
  merge_group:
  # The queue's required check is reported on pull requests too, or every PR would wait for it forever: on a pull request the
  # workflow starts and its jobs are skipped (a skipped job counts as passed and uses no runner).
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      core_only:
        description: 'Run only the core job (tools/ci-test.sh e2e)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    name: End-to-end core
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PAPERBOAT_TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/e2e_test?sslmode=disable
      PAPERBOAT_E2E_CORE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            cli/go.sum
            relay/go.sum
            edge/go.sum
            go.work.sum
      # The edge's control client dials the server by name, and the edge serves HTTP and HTTPS on 80 and 443.
      - run: |
          echo "127.0.0.1 e2e-server.example.test" | sudo tee -a /etc/hosts
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
      # A skipped test exits 0 (the env line above is the only thing that runs it): the job needs the PASS line.
      - working-directory: server
        run: |
          go test -count=1 -timeout 35m -v -run '^TestE2ECore$' ./internal/app | tee "$RUNNER_TEMP/core.log"
          grep -q -- '^--- PASS: TestE2ECore ' "$RUNNER_TEMP/core.log"

  # F21-57 / F21-55: three server instances behind one proxy, one SIGKILLed mid-run. Not a required check, and
  # not on main pushes or tools/ci-test.sh e2e.
  multi:
    name: End-to-end, 3 server instances
    if: ${{ !inputs.core_only && github.event_name != 'merge_group' && github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PAPERBOAT_TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/e2e_test?sslmode=disable
      E2E_STAGES: pair exec multi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            server/go.sum
            cli/go.sum
            go.work.sum
      - run: tools/e2e/run.sh
