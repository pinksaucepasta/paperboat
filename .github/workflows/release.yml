name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact already-qualified immutable release tag'
        required: true
        type: string
      qualification_run:
        description: 'Original tag-push Release run with six successful qualification jobs'
        required: true
        type: string
  push:
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9].*'

run-name: Release ${{ github.ref_name }}

concurrency:
  group: paperboat-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
  SUPERVISOR_MAINTENANCE: 'true'
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  # Preserve the repository identity already signed into production TUF.
  # GitHub redirects this alias to the canonical repository.
  PAPERBOAT_GITHUB_REPOSITORY: pinksaucepasta/paperboat-cli

defaults:
  run:
    working-directory: cli

jobs:
  release-authority:
    name: Validate trusted source and read-only origin access
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    environment: paperboat-tuf-published
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      artifact_run_id: ${{ steps.source.outputs.artifact_run_id }}
      maintenance: ${{ steps.source.outputs.maintenance }}
      server_url: ${{ steps.endpoints.outputs.server_url }}
      release_url: ${{ steps.endpoints.outputs.release_url }}
      release_host: ${{ steps.endpoints.outputs.release_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Validate immutable source and existing qualification
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        shell: bash
        run: |
          set -euo pipefail
          ./tools/release-version.sh validate-format "$RELEASE_VERSION"
          tag_ref="refs/tags/$RELEASE_VERSION"
          source_sha=$(git ls-remote origin "$tag_ref" "$tag_ref^{}" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { commit=$1 } END { print peeled ? peeled : commit }')
          test -n "$source_sha"
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$GITHUB_REF" = "$tag_ref"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$source_sha" = "$GITHUB_SHA"
            artifact_run_id="$GITHUB_RUN_ID"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            [[ "$QUALIFICATION_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" > "$RUNNER_TEMP/qualification-workflow.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" > "$RUNNER_TEMP/qualification-run.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/qualification-jobs.json"
            SOURCE_SHA="$source_sha" python3 - <<'PYVERIFY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root/'qualification-run.json').read_text())
          workflow = json.loads((root/'qualification-workflow.json').read_text())
          repository = os.environ['GITHUB_REPOSITORY']
          if (run.get('repository', {}).get('full_name') != repository or
              run.get('head_repository', {}).get('full_name') != repository or
              run.get('path') != '.github/workflows/release.yml' or
              run.get('workflow_id') != workflow.get('id') or run.get('event') != 'push' or
              run.get('head_branch') != os.environ['RELEASE_VERSION'] or
              run.get('head_sha') != os.environ['SOURCE_SHA'] or
              run.get('status') != 'completed'):
              raise SystemExit('Qualification run does not identify this exact repository/tag/source.')
          expected = {'Validate trusted source and read-only origin access',
                      'Build Linux amd64 executable', 'Build Linux arm64 executable',
                      'Build and natively qualify Windows amd64 executable',
                      'Build and natively qualify Windows arm64 executable',
                      'Build macOS arm64 package'}
          jobs = [job for page in json.loads((root/'qualification-jobs.json').read_text()) for job in page['jobs']]
          qualified = {job['name'] for job in jobs if job.get('status') == 'completed' and job.get('conclusion') == 'success'}
          if not expected <= qualified:
              raise SystemExit('Required source authority or native qualification is missing.')
          PYVERIFY
            artifact_run_id="$QUALIFICATION_RUN"
          fi
          git fetch --depth=1 origin "$tag_ref"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$source_sha"
          maintenance=$(git show "$source_sha:.github/workflows/release.yml" | sed -n "s/^  SUPERVISOR_MAINTENANCE: '\(true\|false\)'$/\1/p")
          test "$maintenance" = true || test "$maintenance" = false
          printf 'source_sha=%s\nartifact_run_id=%s\nmaintenance=%s\n' "$source_sha" "$artifact_run_id" "$maintenance" >> "$GITHUB_OUTPUT"
      - name: Validate protected release endpoints
        id: endpoints
        env:
          SERVER_URL: ${{ vars.PAPERBOAT_DEFAULT_SERVER_URL }}
          RELEASE_URL: ${{ vars.PAPERBOAT_DEFAULT_RELEASE_URL }}
          RELEASE_HOST: ${{ vars.PAPERBOAT_RELEASE_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from urllib.parse import urlsplit

          def endpoint(name, value, path=None):
              if not value or value != value.strip() or any(c.isspace() for c in value):
                  raise SystemExit(f'{name} is required and must not contain whitespace')
              parsed = urlsplit(value)
              if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment or parsed.port not in (None, 443):
                  raise SystemExit(f'{name} must be an HTTPS URL without credentials, query, fragment, or non-default port')
              if path is not None and parsed.path != path:
                  raise SystemExit(f'{name} must use the exact {path} path')
              if path is None and parsed.path not in ('', '/'):
                  raise SystemExit(f'{name} must be an HTTPS origin without a path')
              return f'https://{parsed.hostname.lower()}{path or ""}'

          server = endpoint('PAPERBOAT_DEFAULT_SERVER_URL', os.environ.get('SERVER_URL', ''))
          release = endpoint('PAPERBOAT_DEFAULT_RELEASE_URL', os.environ.get('RELEASE_URL', ''), '/tuf')
          host = os.environ.get('RELEASE_HOST', '')
          if not host or host != host.strip() or any(c.isspace() for c in host) or '/' in host or ':' in host:
              raise SystemExit('PAPERBOAT_RELEASE_HOST must be a canonical SSH host name or IPv4 address')
          print(f'server_url={server}')
          print(f'release_url={release}')
          print(f'release_host={host}')
          PY
      - name: Configure protected origin read identity
        env:
          PAPERBOAT_RELEASE_SSH_KEY: ${{ secrets.PAPERBOAT_RELEASE_SSH_KEY }}
          PAPERBOAT_RELEASE_KNOWN_HOSTS: ${{ secrets.PAPERBOAT_RELEASE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAPERBOAT_RELEASE_SSH_KEY" || { echo 'PAPERBOAT_RELEASE_SSH_KEY is required' >&2; exit 1; }
          test -n "$PAPERBOAT_RELEASE_KNOWN_HOSTS" || { echo 'PAPERBOAT_RELEASE_KNOWN_HOSTS is required' >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PAPERBOAT_RELEASE_SSH_KEY" > "$HOME/.ssh/paperboat-release"
          printf '%s\n' "$PAPERBOAT_RELEASE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/paperboat-release" "$HOME/.ssh/known_hosts"
      - name: Verify production metadata origin is readable
        env:
          RELEASE_HOST: ${{ steps.endpoints.outputs.release_host }}
          RELEASE_URL: ${{ steps.endpoints.outputs.release_url }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$RELEASE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/opt/paperboat/releases
          test -d "$root" && test ! -L "$root"
          test -d "$root/current" && test ! -L "$root/current"
          test -d "$root/staging" && test ! -L "$root/staging" && test -w "$root/staging"
          test -d "$root/current/tuf/targets" && test ! -L "$root/current/tuf/targets"
          test -d "$root/current/tuf/metadata" && test ! -L "$root/current/tuf/metadata"
          REMOTE
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 5 --max-time 15 --max-filesize 1048576 \
            "$RELEASE_URL/metadata/root.json" -o "$RUNNER_TEMP/paperboat-root.json"

  linux-amd64:
    if: github.event_name == 'push'
    name: Build Linux amd64 executable
    needs: release-authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: paperboat-tuf-published
    permissions:
      contents: read
    env:
      DEFAULT_SERVER_URL: ${{ needs.release-authority.outputs.server_url }}
      DEFAULT_RELEASE_URL: ${{ needs.release-authority.outputs.release_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build official Linux amd64 package
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build-release-asset.sh \
            --platform linux \
            --architecture amd64 \
            --output dist/pb-linux-amd64 \
            --version "$RELEASE_VERSION" \
            --server-url "$DEFAULT_SERVER_URL" \
            --release-url "$DEFAULT_RELEASE_URL"
      - name: Smoke test Linux package
        shell: bash
        run: |
          set -euo pipefail
          asset=dist/pb-linux-amd64
          file "$asset" | grep -E 'ELF|executable'
          if ! version_output=$("$asset" --version); then
            echo "Linux candidate failed its version smoke test: $asset" >&2
            exit 1
          fi
          version_line=$(printf '%s\n' "$version_output" | grep -Eo 'Version[[:space:]]+[0-9A-Za-z._-]+' | tail -n 1 || true)
          if [ "$version_line" != "Version $RELEASE_VERSION" ]; then
            echo "Linux candidate reported an unexpected version: ${version_line:-<missing>} (want $RELEASE_VERSION)" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperboat-candidate-product-linux-amd64
          path: cli/dist/pb-linux-amd64
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-amd64:
    if: github.event_name == 'push'
    name: Build and natively qualify Windows amd64 executable
    needs: release-authority
    runs-on: windows-2025
    timeout-minutes: 20
    environment: paperboat-tuf-published
    permissions:
      contents: read
    env:
      DEFAULT_SERVER_URL: ${{ needs.release-authority.outputs.server_url }}
      DEFAULT_RELEASE_URL: ${{ needs.release-authority.outputs.release_url }}
      PAPERBOAT_WINDOWS_SIGNING_PFX_B64: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_B64 }}
      PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD }}
      PAPERBOAT_WINDOWS_PUBLISHER_SUBJECT: ${{ vars.PAPERBOAT_WINDOWS_PUBLISHER_SUBJECT }}
      PAPERBOAT_WINDOWS_TIMESTAMP_URL: ${{ vars.PAPERBOAT_WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build official Windows amd64 executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'cli\dist\pb-windows-amd64.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $output) | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          if ($env:SENTRY_DSN -cnotmatch '\Ahttps://[A-Za-z0-9]+@[A-Za-z0-9.-]+(:[0-9]+)?/[0-9]+\z') { throw 'Official candidate requires a valid HTTPS SENTRY_DSN.' }
          $ldflags = "-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultSentryDSN=$env:SENTRY_DSN -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultSentryRelease=paperboat:$env:RELEASE_VERSION -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Distribution=official -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=$env:RELEASE_VERSION -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=$env:GITHUB_SHA -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=$env:DEFAULT_SERVER_URL -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=$env:DEFAULT_RELEASE_URL"
          & go build -buildvcs=false -trimpath -ldflags $ldflags -o $output ./cmd/pb
          if ($LASTEXITCODE -ne 0) { throw 'Unified Windows candidate build failed.' }
      - name: Authenticode sign when release certificate is configured
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./packaging/windows/scripts/sign-and-verify.ps1 `
            -Path (Join-Path $env:GITHUB_WORKSPACE 'cli\dist\pb-windows-amd64.exe') `
            -Architecture 'amd64' `
            -Description 'Paperboat unified executable'
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable signing failed.' }
      - name: Smoke test Windows package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'cli\dist\pb-windows-amd64.exe'
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Windows candidate is missing.' }
          $versionOutput = (& $output --version 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw 'Windows candidate failed its version smoke test.' }
          $versionMatches = [regex]::Matches($versionOutput, 'Version[\t ]+[0-9A-Za-z._-]+')
          $expectedVersionLine = "Version $env:RELEASE_VERSION"
          if ($versionMatches.Count -ne 1 -or $versionMatches[0].Value -ne $expectedVersionLine) {
            throw "Windows candidate reported an unexpected version (want $env:RELEASE_VERSION): $versionOutput"
          }
      - name: Record native Windows qualification handoff
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $qualification = [ordered]@{
            schema = 'paperboat.windows-native-qualification/v1'
            release_version = $env:RELEASE_VERSION
            platform = 'windows'
            architecture = 'amd64'
            status = 'passed'
            native_tested = $true
            windows_build = [Environment]::OSVersion.Version.Build.ToString()
            runner = if ($env:RUNNER_NAME) { $env:RUNNER_NAME } else { 'windows-2025' }
          }
          $qualificationPath = Join-Path $env:RUNNER_TEMP 'windows-amd64-native-qualification.json'
          $json = $qualification | ConvertTo-Json -Compress
          [IO.File]::WriteAllText($qualificationPath, $json, (New-Object Text.UTF8Encoding($false)))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperboat-candidate-product-windows-amd64
          path: cli/dist/pb-windows-amd64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperboat-candidate-windows-amd64-qualification
          path: ${{ runner.temp }}/windows-amd64-native-qualification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux-arm64:
    if: github.event_name == 'push'
    name: Build Linux arm64 executable
    needs: release-authority
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: paperboat-tuf-published
    permissions:
      contents: read
    env:
      DEFAULT_SERVER_URL: ${{ needs.release-authority.outputs.server_url }}
      DEFAULT_RELEASE_URL: ${{ needs.release-authority.outputs.release_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build official Linux arm64 package
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build-release-asset.sh \
            --platform linux \
            --architecture arm64 \
            --output dist/pb-linux-arm64 \
            --version "$RELEASE_VERSION" \
            --server-url "$DEFAULT_SERVER_URL" \
            --release-url "$DEFAULT_RELEASE_URL"
      - name: Smoke test Linux package
        shell: bash
        run: |
          set -euo pipefail
          asset=dist/pb-linux-arm64
          file "$asset" | grep -E 'ELF|executable'
          if ! version_output=$("$asset" --version); then
            echo "Linux candidate failed its version smoke test: $asset" >&2
            exit 1
          fi
          version_line=$(printf '%s\n' "$version_output" | grep -Eo 'Version[[:space:]]+[0-9A-Za-z._-]+' | tail -n 1 || true)
          if [ "$version_line" != "Version $RELEASE_VERSION" ]; then
            echo "Linux candidate reported an unexpected version: ${version_line:-<missing>} (want $RELEASE_VERSION)" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperboat-candidate-product-linux-arm64
          path: cli/dist/pb-linux-arm64
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-arm64:
    if: github.event_name == 'push'
    name: Build and natively qualify Windows arm64 executable
    needs: release-authority
    runs-on: windows-11-arm
    timeout-minutes: 20
    environment: paperboat-tuf-published
    permissions:
      contents: read
    env:
      DEFAULT_SERVER_URL: ${{ needs.release-authority.outputs.server_url }}
      DEFAULT_RELEASE_URL: ${{ needs.release-authority.outputs.release_url }}
      PAPERBOAT_WINDOWS_SIGNING_PFX_B64: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_B64 }}
      PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.PAPERBOAT_WINDOWS_SIGNING_PFX_PASSWORD }}
      PAPERBOAT_WINDOWS_PUBLISHER_SUBJECT: ${{ vars.PAPERBOAT_WINDOWS_PUBLISHER_SUBJECT }}
      PAPERBOAT_WINDOWS_TIMESTAMP_URL: ${{ vars.PAPERBOAT_WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build official Windows arm64 executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'cli\dist\pb-windows-arm64.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $output) | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'arm64'
          if ($env:SENTRY_DSN -cnotmatch '\Ahttps://[A-Za-z0-9]+@[A-Za-z0-9.-]+(:[0-9]+)?/[0-9]+\z') { throw 'Official candidate requires a valid HTTPS SENTRY_DSN.' }
          $ldflags = "-s -w -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultSentryDSN=$env:SENTRY_DSN -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultSentryRelease=paperboat:$env:RELEASE_VERSION -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Distribution=official -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Version=$env:RELEASE_VERSION -X github.com/pinksaucepasta/paperboat/internal/buildinfo.Commit=$env:GITHUB_SHA -X github.com/pinksaucepasta/paperboat/internal/buildinfo.ProtocolVersion=1 -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultServerURL=$env:DEFAULT_SERVER_URL -X github.com/pinksaucepasta/paperboat/internal/buildinfo.DefaultReleaseURL=$env:DEFAULT_RELEASE_URL"
          & go build -buildvcs=false -trimpath -ldflags $ldflags -o $output ./cmd/pb
          if ($LASTEXITCODE -ne 0) { throw 'Unified Windows candidate build failed.' }
      - name: Authenticode sign when release certificate is configured
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./packaging/windows/scripts/sign-and-verify.ps1 `
            -Path (Join-Path $env:GITHUB_WORKSPACE 'cli\dist\pb-windows-arm64.exe') `
            -Architecture 'arm64' `
            -Description 'Paperboat unified executable'
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable signing failed.' }
      - name: Smoke test Windows package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'cli\dist\pb-windows-arm64.exe'
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Windows candidate is missing.' }
          $versionOutput = (& $output --version 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw 'Windows candidate failed its version smoke test.' }
          $versionMatches = [regex]::Matches($versionOutput, 'Version[\t ]+[0-9A-Za-z._-]+')
          $expectedVersionLine = "Version $env:RELEASE_VERSION"
          if ($versionMatches.Count -ne 1 -or $versionMatches[0].Value -ne $expectedVersionLine) {
            throw "Windows candidate reported an unexpected version (want $env:RELEASE_VERSION): $versionOutput"
          }
      - name: Record native Windows qualification handoff
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $qualification = [ordered]@{
            schema = 'paperboat.windows-native-qualification/v1'
            release_version = $env:RELEASE_VERSION
            platform = 'windows'
            architecture = 'arm64'
            status = 'passed'
            native_tested = $true
            windows_build = [Environment]::OSVersion.Version.Build.ToString()
            runner = if ($env:RUNNER_NAME) { $env:RUNNER_NAME } else { 'windows-11-arm' }
          }
          $qualificationPath = Join-Path $env:RUNNER_TEMP 'windows-arm64-native-qualification.json'
          $json = $qualification | ConvertTo-Json -Compress
          [IO.File]::WriteAllText($qualificationPath, $json, (New-Object Text.UTF8Encoding($false)))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperboat-candidate-product-windows-arm64
          path: cli/dist/pb-windows-arm64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperboat-candidate-windows-arm64-qualification
          path: ${{ runner.temp }}/windows-arm64-native-qualification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  darwin-arm64:
    if: github.event_name == 'push'
    name: Build macOS arm64 package
    needs: release-authority
    runs-on: macos-14
    timeout-minutes: 30
    environment: paperboat-tuf-published
    permissions:
      contents: read
    env:
      DEFAULT_SERVER_URL: ${{ needs.release-authority.outputs.server_url }}
      DEFAULT_RELEASE_URL: ${{ needs.release-authority.outputs.release_url }}
      APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Import Developer ID Installer certificate
        if: ${{ env.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_INSTALLER_CERTIFICATE_PASSWORD APPLE_INSTALLER_SIGNING_IDENTITY; do
            test -n "${!name}" || { echo "$name is required when an Apple installer certificate is configured" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/paperboat-release.keychain-db"
          password="$(uuidgen)"
          certificate="$RUNNER_TEMP/paperboat-installer.p12"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate" 2>/dev/null || printf '%s' "$APPLE_INSTALLER_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
      - name: Build and package official macOS arm64 executable
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build-release-asset.sh \
            --platform darwin \
            --architecture arm64 \
            --output "$RUNNER_TEMP/pb-darwin-arm64" \
            --version "$RELEASE_VERSION" \
            --server-url "$DEFAULT_SERVER_URL" \
            --release-url "$DEFAULT_RELEASE_URL"
          mkdir -p dist
          if [ -n "$APPLE_INSTALLER_SIGNING_IDENTITY" ]; then
            ./tools/build-macos-pkg.sh \
              --binary "$RUNNER_TEMP/pb-darwin-arm64" \
              --output dist/pb-darwin-arm64.pkg \
              --version "$RELEASE_VERSION" \
              --signing-identity "$APPLE_INSTALLER_SIGNING_IDENTITY"
          else
            ./tools/build-macos-pkg.sh \
              --binary "$RUNNER_TEMP/pb-darwin-arm64" \
              --output dist/pb-darwin-arm64.pkg \
              --version "$RELEASE_VERSION"
          fi
      - name: Smoke test macOS package
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/pb-darwin-arm64"
          if ! version_output=$("$binary" --version); then
            echo 'macOS candidate binary failed its version smoke test.' >&2
            exit 1
          fi
          version_line=$(printf '%s\n' "$version_output" | grep -Eo 'Version[[:space:]]+[0-9A-Za-z._-]+' | tail -n 1 || true)
          if [ "$version_line" != "Version $RELEASE_VERSION" ]; then
            echo "macOS candidate binary reported an unexpected version: ${version_line:-<missing>} (want $RELEASE_VERSION)" >&2
            exit 1
          fi
          expanded="$RUNNER_TEMP/pb-darwin-arm64-expanded"
          pkgutil --expand dist/pb-darwin-arm64.pkg "$expanded"
          package_version=$(sed -nE 's/.*<pkg-info[^>]* version="([^"]*)".*/\1/p' "$expanded/PackageInfo")
          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "macOS PKG reported an unexpected version: ${package_version:-<missing>} (want $RELEASE_VERSION)" >&2
            exit 1
          fi
          payload_files=$(pkgutil --payload-files dist/pb-darwin-arm64.pkg)
          for expected in \
            './usr/local/bin/pb' \
            './Library/PrivilegedHelperTools/Paperboat/bin/pb'; do
            if ! printf '%s\n' "$payload_files" | grep -Fqx "$expected"; then
              echo "macOS PKG is missing the unified runtime payload $expected" >&2
              exit 1
            fi
          done
          if printf '%s\n' "$payload_files" | grep -Eq '(^|/)(Application Support|LaunchDaemons)(/|$)|\.plist$'; then
            echo 'macOS PKG must not publish updater state or service declarations' >&2
            exit 1
          fi
      - name: Notarize and staple macOS PKG
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_INSTALLER_SIGNING_IDENTITY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/pb-darwin-arm64.pkg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/pb-darwin-arm64.pkg
          xcrun stapler validate dist/pb-darwin-arm64.pkg
          pkgutil --check-signature dist/pb-darwin-arm64.pkg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperboat-candidate-product-darwin-arm64
          path: cli/dist/pb-darwin-arm64.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-publication:
    if: ${{ always() && needs.release-authority.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.linux-amd64.result == 'success' && needs.linux-arm64.result == 'success' && needs.windows-amd64.result == 'success' && needs.windows-arm64.result == 'success' && needs.darwin-arm64.result == 'success')) }}
    name: Publish five qualified products and signed TUF metadata
    needs: [release-authority, linux-amd64, linux-arm64, windows-amd64, windows-arm64, darwin-arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    environment: paperboat-tuf-published
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SOURCE_SHA: ${{ needs.release-authority.outputs.source_sha }}
      SUPERVISOR_MAINTENANCE: ${{ needs.release-authority.outputs.maintenance }}
      RELEASE_HOST: ${{ needs.release-authority.outputs.release_host }}
      PAPERBOAT_TUF_CI: '1'
      PAPERBOAT_TUF_KEY_TARGETS_1: ${{ secrets.PAPERBOAT_TUF_KEY_TARGETS_1 }}
      PAPERBOAT_TUF_KEY_TARGETS_2: ${{ secrets.PAPERBOAT_TUF_KEY_TARGETS_2 }}
      PAPERBOAT_TUF_KEY_SNAPSHOT_1: ${{ secrets.PAPERBOAT_TUF_KEY_SNAPSHOT_1 }}
      PAPERBOAT_TUF_KEY_TIMESTAMP_2: ${{ secrets.PAPERBOAT_TUF_KEY_TIMESTAMP_2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-authority.outputs.source_sha }}
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.release-authority.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          pattern: paperboat-candidate-product-*
          path: ${{ runner.temp }}/candidate-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.release-authority.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          name: paperboat-candidate-windows-amd64-qualification
          path: ${{ runner.temp }}/candidate-qualification
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.release-authority.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          name: paperboat-candidate-windows-arm64-qualification
          path: ${{ runner.temp }}/candidate-qualification
      - name: Validate the exact five-asset candidate set
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/candidate-artifacts" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          entries = list(root.iterdir())
          if any(not item.is_file() or item.is_symlink() for item in entries):
              raise SystemExit("candidate artifact directory contains a non-regular entry")
          expected = {
              "pb-darwin-arm64.pkg",
              "pb-linux-amd64",
              "pb-linux-arm64",
              "pb-windows-amd64.exe",
              "pb-windows-arm64.exe",
          }
          actual = {item.name for item in entries}
          if actual != expected:
              raise SystemExit(f"candidate artifact set is {sorted(actual)}, expected {sorted(expected)}")
          if any(not (root / name).is_file() or (root / name).is_symlink() or (root / name).stat().st_size == 0 for name in expected):
              raise SystemExit("candidate contains a missing, empty, or unsafe package")
          PY
          test -s "$RUNNER_TEMP/candidate-qualification/windows-amd64-native-qualification.json"
          test -s "$RUNNER_TEMP/candidate-qualification/windows-arm64-native-qualification.json"
      - name: Build and validate the selected artifact manifest and deployment plan
        shell: bash
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/paperboat-update-candidate-inputs"
          mkdir -p "$input_dir"
          go run ./tools/release-plan manifest \
            -version "$RELEASE_VERSION" \
            -source-commit "$RELEASE_SOURCE_SHA" \
            -toolchain "$(go env GOVERSION)" \
            -artifacts "$RUNNER_TEMP/candidate-artifacts" \
            -output "$input_dir/manifest.json"
          go run ./tools/release-plan plan \
            -manifest "$input_dir/manifest.json" \
            -policy-revision "$GITHUB_RUN_ID" \
            -severity routine \
            -cohort-seed "candidate-$RELEASE_VERSION" \
            -output "$input_dir/deployment-plan.json"
          # Dev acceptance release: make every supported platform wave eligible
          # immediately while keeping the signed stability policy unchanged.
          python3 - "$input_dir/deployment-plan.json" <<'PYPLAN'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          plan = json.loads(path.read_text())
          for cohort in plan["cohorts"]:
              cohort["percentage"] = 100
          path.write_text(json.dumps(plan, separators=(",", ":")) + "\n")
          PYPLAN
          go run ./tools/release-plan validate \
            -manifest "$input_dir/manifest.json" \
            -plan "$input_dir/deployment-plan.json" \
            -artifacts "$RUNNER_TEMP/candidate-artifacts"
      - name: Configure protected origin read identity
        env:
          PAPERBOAT_RELEASE_SSH_KEY: ${{ secrets.PAPERBOAT_RELEASE_SSH_KEY }}
          PAPERBOAT_RELEASE_KNOWN_HOSTS: ${{ secrets.PAPERBOAT_RELEASE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAPERBOAT_RELEASE_SSH_KEY" || { echo 'PAPERBOAT_RELEASE_SSH_KEY is required' >&2; exit 1; }
          test -n "$PAPERBOAT_RELEASE_KNOWN_HOSTS" || { echo 'PAPERBOAT_RELEASE_KNOWN_HOSTS is required' >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PAPERBOAT_RELEASE_SSH_KEY" > "$HOME/.ssh/paperboat-release"
          printf '%s\n' "$PAPERBOAT_RELEASE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/paperboat-release" "$HOME/.ssh/known_hosts"
      - name: Create or resume the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Recheck after qualification: a tag changed during the builds must
          # never publish these bytes under a different source identity.
          remote_commit=$(git ls-remote origin "refs/tags/$RELEASE_VERSION" "refs/tags/$RELEASE_VERSION^{}" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { commit=$1 } END { print peeled ? peeled : commit }')
          test "$remote_commit" = "$RELEASE_SOURCE_SHA" || { echo 'Release tag changed during qualification.' >&2; exit 1; }
          if ! gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Paperboat $RELEASE_VERSION" --notes "Paperboat $RELEASE_VERSION; source $RELEASE_SOURCE_SHA" --draft --latest=false
          fi
      - name: Upload only missing draft assets; never replace published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP/candidate-artifacts/"*; do
            gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets > "$RUNNER_TEMP/release-upload.json"
            decision=$(python3 - "$RUNNER_TEMP/release-upload.json" "$file" <<'PYUPLOAD'
          import hashlib, json, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          path = pathlib.Path(sys.argv[2])
          assets = [item for item in release['assets'] if item['name'] == path.name]
          if len(assets) > 1:
              raise SystemExit('duplicate release asset')
          if assets:
              asset = assets[0]
              if asset.get('size') != path.stat().st_size or asset.get('digest') != 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest():
                  raise SystemExit('existing immutable release asset differs from qualified bytes')
              print('present')
          elif not release['isDraft']:
              raise SystemExit('published release is missing a qualified product; immutable release cannot be changed')
          else:
              print('upload')
          PYUPLOAD
            )
            if [ "$decision" = upload ]; then
              # An ambiguous successful upload is recognized on the next attempt.
              uploaded=false
              for attempt in 1 2 3; do
                if timeout --signal=TERM 300 gh release upload "$RELEASE_VERSION" "$file" --repo "$GITHUB_REPOSITORY"; then uploaded=true; break; fi
                gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/release-upload.json"
                if python3 - "$RUNNER_TEMP/release-upload.json" "$file" <<'PYRETRY'
          import hashlib, json, pathlib, sys
          path = pathlib.Path(sys.argv[2])
          assets = [item for item in json.loads(pathlib.Path(sys.argv[1]).read_text())['assets'] if item['name'] == path.name]
          raise SystemExit(0 if len(assets) == 1 and assets[0].get('size') == path.stat().st_size and assets[0].get('digest') == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest() else 1)
          PYRETRY
                then uploaded=true; break; fi
                if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
              done
              test "$uploaded" = true || { echo 'Qualified product upload failed; rerun failed jobs to reuse artifact bytes.' >&2; exit 1; }
            fi
          done
      - name: Verify GitHub asset bytes and exact asset set without re-downloading
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/candidate-artifacts" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          roots = [pathlib.Path(path) for path in sys.argv[2:]]
          release_version = os.environ['RELEASE_VERSION']
          repository = os.environ['GITHUB_REPOSITORY']
          if release.get('tagName') != release_version:
              raise SystemExit(f'GitHub release tag is {release.get("tagName")!r}, expected {release_version!r}')
          expected = {path.name: path for root in roots for path in root.iterdir() if path.is_file()}
          assets = {asset['name']: asset for asset in release.get('assets', [])}
          if set(assets) != set(expected):
              raise SystemExit(f'GitHub asset set is {sorted(assets)}, expected {sorted(expected)}')
          for name, path in expected.items():
              asset = assets[name]
              digest = asset.get('digest')
              if asset.get('size') != path.stat().st_size:
                  raise SystemExit(f'GitHub asset size mismatch: {name}')
              if not digest:
                  raise SystemExit(f'GitHub API did not return a digest for {name}')
              expected_digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != expected_digest:
                  raise SystemExit(f'GitHub asset digest mismatch: {name}')
          PY
      - name: Publish release assets without changing Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # TUF must never point at a draft-only asset. Make the
          # verified assets public first, while leaving the Latest selector
          # unchanged until the origin exchange succeeds below.
          # Publishing an existing public release is a no-op. A draft must not
          # advance Latest before the signed origin exchange is verified.
          if test "$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true; then
            latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if test "$latest_tag" = "$RELEASE_VERSION"; then
              gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
            else
              gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            fi
          fi
      - name: Verify published GitHub download URLs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,assets > "$RUNNER_TEMP/published-release.json"
          python3 - "$RUNNER_TEMP/published-release.json" <<'PY'
          import json
          import os
          import pathlib

          release = json.loads(pathlib.Path(__import__('sys').argv[1]).read_text())
          version = os.environ['RELEASE_VERSION']
          repository = os.environ['GITHUB_REPOSITORY']
          if release.get('tagName') != version:
              raise SystemExit('published release tag mismatch')
          expected_prefix = f'https://github.com/{repository}/releases/download/{version}/'
          for asset in release.get('assets', []):
              expected = expected_prefix + asset['name']
              # `gh release view --json assets` exposes the public download
              # URL as `url` once the draft has been published.
              if asset.get('url') != expected:
                  raise SystemExit(f'published GitHub asset URL mismatch: {asset["name"]}')
          PY
      - name: Read and validate current production TUF signing state
        shell: bash
        run: |
          set -euo pipefail
          repository="$RUNNER_TEMP/tuf-candidate"
          mkdir -p "$repository/targets"
          ssh -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$RELEASE_HOST" \
            'tar -C /opt/paperboat/releases/current/tuf -cf - metadata' | tar -C "$repository" -xf -
          install -m 0600 tools/tuf-repository/active-signing-state.json "$repository/.signing-state.json"
          go run ./tools/tuf-repository validate-signers \
            -repository "$repository" \
            -trusted-root "$GITHUB_WORKSPACE/cli/internal/hostruntime/bootstrap/trusted-root.json"
          go run ./tools/tuf-repository verify-published -repository "$repository"
      - name: Recognize an already committed release without re-signing
        id: committed
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/tuf-candidate/metadata/targets.json" "$RUNNER_TEMP/candidate-artifacts" "$RUNNER_TEMP/paperboat-update-candidate-inputs/manifest.json" <<'PYCOMMITTED' >> "$GITHUB_OUTPUT"
          import hashlib, json, os, pathlib, sys
          targets = json.loads(pathlib.Path(sys.argv[1]).read_text())['signed']['targets']
          artifacts = pathlib.Path(sys.argv[2])
          version = os.environ['RELEASE_VERSION']
          selected = [target['custom']['version'] == version for target in targets.values()]
          if any(selected):
              if not all(selected) or len(targets) != 5:
                  raise SystemExit('live release only partially matches the requested version')
              manifest_digest = hashlib.sha256(pathlib.Path(sys.argv[3]).read_bytes()).hexdigest()
              for name, target in targets.items():
                  path = artifacts / name
                  custom = target['custom']
                  if target['hashes']['sha256'] != hashlib.sha256(path.read_bytes()).hexdigest() or target['length'] != path.stat().st_size or custom['repository'] != os.environ['PAPERBOAT_GITHUB_REPOSITORY'] or custom['release_index']['manifest_sha256'] != manifest_digest or custom['release_index']['supervisor_maintenance_required'] is not False:
                      raise SystemExit('live release identity differs from qualified source/artifacts')
              print('already_published=true')
          else:
              print('already_published=false')
          PYCOMMITTED
      - name: Sign the five qualified release targets
        if: steps.committed.outputs.already_published != 'true'
        env:
          PAPERBOAT_GITHUB_REPOSITORY: ${{ env.PAPERBOAT_GITHUB_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$RUNNER_TEMP/tuf-candidate"
          input_dir="$RUNNER_TEMP/paperboat-update-candidate-inputs"
          go run ./tools/tuf-repository publish \
            -repository "$repository" \
            -version "$RELEASE_VERSION" \
            -artifacts "$RUNNER_TEMP/candidate-artifacts" \
            -manifest "$input_dir/manifest.json" \
            -deployment-plan "$input_dir/deployment-plan.json" \
            -windows-amd64-native-evidence "$RUNNER_TEMP/candidate-qualification/windows-amd64-native-qualification.json" \
            -windows-arm64-native-evidence "$RUNNER_TEMP/candidate-qualification/windows-arm64-native-qualification.json" \
            -rollout-revision "$GITHUB_RUN_ID" \
            -severity routine \
            -supervisor-maintenance="$SUPERVISOR_MAINTENANCE"
          go run ./tools/tuf-repository verify-published -repository "$repository"
      - name: Render product-pinned installers and prepare the publishable origin
        shell: bash
        run: |
          set -euo pipefail
          origin_dir="$RUNNER_TEMP/candidate-origin"
          mkdir -p "$origin_dir/tuf/targets"
          cp -R "$RUNNER_TEMP/tuf-candidate/metadata" "$origin_dir/tuf/"
          python3 tools/render-installers.py \
            "$RUNNER_TEMP/tuf-candidate/metadata/targets.json" \
            "$origin_dir/install" \
            "$origin_dir/windows"
          chmod 0755 "$origin_dir/install"
          tar -C "$origin_dir" -czf "$RUNNER_TEMP/candidate-origin.tgz" install windows tuf
      - name: Atomically activate installers and TUF on the protected origin
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/candidate-origin.tgz"
          digest=$(sha256sum "$bundle" | awk '{print $1}')
          remote_bundle="/opt/paperboat/releases/staging/paperboat-release-$RELEASE_VERSION-$GITHUB_RUN_ID.tgz"
          remote_script="/opt/paperboat/releases/staging/publish-tuf-origin-$GITHUB_RUN_ID.sh"
          scp -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "$bundle" "root@$RELEASE_HOST:$remote_bundle"
          scp -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes tools/publish-tuf-origin.sh "root@$RELEASE_HOST:$remote_script"
          # A lost SSH acknowledgement after exchange must not cause a second
          # exchange. Compare only this publication's owned files; selfhost has
          # its own owner and is preserved by the publisher.
          ssh -i "$HOME/.ssh/paperboat-release" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$RELEASE_HOST"             "bash -s -- '$remote_bundle' '$remote_script' '$RELEASE_VERSION' '$digest'" <<'REMOTE'
          set -euo pipefail
          bundle=$1 script=$2 version=$3 digest=$4
          trap 'rm -f -- "$bundle" "$script"' EXIT
          chmod 0700 "$script"
          if python3 - "$bundle" "$digest" <<'PYLIVE'
          import hashlib, pathlib, sys, tarfile
          bundle = pathlib.Path(sys.argv[1])
          if bundle.is_symlink() or hashlib.sha256(bundle.read_bytes()).hexdigest() != sys.argv[2]:
              raise SystemExit(1)
          live = pathlib.Path('/opt/paperboat/releases/current')
          with tarfile.open(bundle, 'r:gz') as archive:
              files = [item for item in archive.getmembers() if item.isfile()]
              expected = {item.name for item in files}
              actual = {'install', 'windows'} | {str(path.relative_to(live)) for path in (live/'tuf').rglob('*') if path.is_file()}
              if expected != actual:
                  raise SystemExit(1)
              for item in files:
                  path = live/item.name
                  if path.is_symlink() or not path.is_file() or path.read_bytes() != archive.extractfile(item).read():
                      raise SystemExit(1)
          PYLIVE
          then
            echo 'The exact signed release and installers are already active.'
          else
            "$script" "$bundle" /opt/paperboat/releases "$version" "$digest"
          fi
          REMOTE
      - name: Verify active public metadata before marking Latest
        shell: bash
        run: |
          set -euo pipefail
          for role in root targets snapshot timestamp; do
            curl --fail --silent --show-error --proto '=https' --connect-timeout 5 --max-time 15 --max-filesize 1048576               "${{ needs.release-authority.outputs.release_url }}/metadata/$role.json" -o "$RUNNER_TEMP/active-$role.json"
            cmp "$RUNNER_TEMP/active-$role.json" "$RUNNER_TEMP/tuf-candidate/metadata/$role.json"
          done
      - name: Mark the verified release Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
      - name: Summarize the completed release
        shell: bash
        run: |
          printf 'Release **%s** published five qualified products, signed TUF metadata and product-pinned installers; Latest advanced after origin verification.\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
