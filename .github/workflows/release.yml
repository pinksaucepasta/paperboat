name: Qualify exact Windows release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical candidate version
        required: true
        type: string
      source_commit:
        description: Frozen source SHA recorded in the candidate manifest
        required: true
        type: string
      windows_amd64_asset_id:
        required: true
        type: string
      windows_amd64_sha256:
        required: true
        type: string
      windows_amd64_length:
        required: true
        type: string
      windows_arm64_asset_id:
        required: true
        type: string
      windows_arm64_sha256:
        required: true
        type: string
      windows_arm64_length:
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify-windows:
    name: Qualify exact Windows ${{ matrix.architecture }} asset
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            native_architecture: X64
            runner: windows-2025
            asset_id: ${{ inputs.windows_amd64_asset_id }}
            sha256: ${{ inputs.windows_amd64_sha256 }}
            length: ${{ inputs.windows_amd64_length }}
          - architecture: arm64
            native_architecture: Arm64
            runner: windows-11-arm
            asset_id: ${{ inputs.windows_arm64_asset_id }}
            sha256: ${{ inputs.windows_arm64_sha256 }}
            length: ${{ inputs.windows_arm64_length }}
    steps:
      - name: Verify exact draft asset and execute native version smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          ASSET_ID: ${{ matrix.asset_id }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          EXPECTED_LENGTH: ${{ matrix.length }}
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
          NATIVE_ARCHITECTURE: ${{ matrix.native_architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($env:RELEASE_VERSION -cnotmatch '\A[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+\z') { throw 'Invalid canonical release version.' }
          if ($env:SOURCE_COMMIT -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Invalid frozen source SHA.' }
          if ($env:SOURCE_COMMIT -cne $env:WORKFLOW_COMMIT) { throw 'Workflow source differs from frozen candidate source.' }
          if ($env:ASSET_ID -cnotmatch '\A[1-9][0-9]*\z') { throw 'Invalid draft asset ID.' }
          if ($env:EXPECTED_SHA256 -cnotmatch '\A[0-9a-f]{64}\z') { throw 'Invalid expected asset SHA256.' }
          if ($env:EXPECTED_LENGTH -cnotmatch '\A[1-9][0-9]*\z') { throw 'Invalid expected asset length.' }
          $osArch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($osArch -cne $env:NATIVE_ARCHITECTURE) { throw 'Runner is not native for the selected architecture.' }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = 'https://api.github.com/repos/pinksaucepasta/paperboat'
          $source = Invoke-RestMethod -Uri "$apiRoot/commits/$env:SOURCE_COMMIT" -Headers $headers
          if ($source.sha -cne $env:SOURCE_COMMIT) { throw 'Frozen source commit is unavailable in the release repository.' }
          $release = Invoke-RestMethod -Uri "$apiRoot/releases/tags/$env:RELEASE_VERSION" -Headers $headers
          if ($release.tag_name -cne $env:RELEASE_VERSION -or -not $release.draft) { throw 'Candidate must be the exact unpublished draft release.' }
          $name = "pb-windows-$env:TARGET_ARCHITECTURE.exe"
          $assets = @($release.assets | Where-Object { [string]$_.id -ceq $env:ASSET_ID -and $_.name -ceq $name })
          if ($assets.Count -ne 1 -or [long]$assets[0].size -ne [long]$env:EXPECTED_LENGTH) { throw 'Draft asset identity or length does not match the frozen candidate.' }
          $asset = Join-Path $env:RUNNER_TEMP $name
          try {
            $binaryHeaders = $headers.Clone()
            $binaryHeaders.Accept = 'application/octet-stream'
            Invoke-WebRequest -Uri "$apiRoot/releases/assets/$env:ASSET_ID" -Headers $binaryHeaders -OutFile $asset
            if ((Get-Item -LiteralPath $asset).Length -ne [long]$env:EXPECTED_LENGTH) { throw 'Downloaded candidate length mismatch.' }
            $actualSha = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha -cne $env:EXPECTED_SHA256) { throw 'Downloaded candidate SHA256 mismatch.' }
            # PE machine identity prevents an emulated x64 binary from qualifying ARM64.
            $bytes = [IO.File]::ReadAllBytes($asset)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Candidate is not a PE executable.' }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 64 -or $peOffset -gt ($bytes.Length - 6)) { throw 'Candidate PE header is invalid.' }
            if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw 'Candidate PE signature is invalid.' }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            $expectedMachine = if ($env:TARGET_ARCHITECTURE -ceq 'arm64') { 0xaa64 } else { 0x8664 }
            if ($machine -ne $expectedMachine) { throw 'Candidate PE architecture mismatch.' }
            $bytes = $null
            $versionOutput = (& $asset --version 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'Native candidate version smoke failed.' }
            $versionMatches = [regex]::Matches($versionOutput, 'Version[\t ]+[0-9A-Za-z._-]+')
            if ($versionMatches.Count -ne 1 -or $versionMatches[0].Value -cne "Version $env:RELEASE_VERSION") { throw 'Native candidate reported the wrong version.' }
            $qualification = [ordered]@{
              schema = 'paperboat.windows-native-qualification/v1'
              release_version = $env:RELEASE_VERSION
              platform = 'windows'
              architecture = $env:TARGET_ARCHITECTURE
              status = 'passed'
              native_tested = $true
              windows_build = [Environment]::OSVersion.Version.Build.ToString()
              runner = $env:RUNNER_NAME
            }
            $evidence = Join-Path $env:RUNNER_TEMP "windows-$env:TARGET_ARCHITECTURE-native-qualification.json"
            [IO.File]::WriteAllText($evidence, ($qualification | ConvertTo-Json -Compress), [Text.UTF8Encoding]::new($false))
            Write-Output "Native package smoke passed: $name version=$env:RELEASE_VERSION sha256=$actualSha length=$env:EXPECTED_LENGTH source=$env:SOURCE_COMMIT"
          } finally {
            Remove-Item -LiteralPath $asset -Force -ErrorAction SilentlyContinue
          }
      - name: Upload native qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-windows-${{ matrix.architecture }}
          path: ${{ runner.temp }}/windows-${{ matrix.architecture }}-native-qualification.json
          if-no-files-found: error
          retention-days: 7
