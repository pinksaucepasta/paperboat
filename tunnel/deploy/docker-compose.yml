services:
  tunnel:
    image: ${PAPERBOAT_TUNNEL_IMAGE:?set PAPERBOAT_TUNNEL_IMAGE}
    restart: unless-stopped
    # Let the tunnel drain long-lived connector streams before Docker force-kills it.
    stop_grace_period: 45s
    command: ["run", "--state-dir", "/var/lib/paperboat-tunnel/operator"]
    environment:
      PAPERBOAT_SENTRY_ENABLED: ${PAPERBOAT_SENTRY_ENABLED:-}
      PAPERBOAT_SENTRY_DSN: ${PAPERBOAT_SENTRY_DSN:-}
      PAPERBOAT_SENTRY_RELEASE: ${PAPERBOAT_SENTRY_RELEASE:-}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
      - "${PAPERBOAT_TUNNEL_CARRIER_TCP_PORT:-27443}:${PAPERBOAT_TUNNEL_CARRIER_TCP_PORT:-27443}/tcp"
      - "${PAPERBOAT_TUNNEL_CARRIER_QUIC_PORT:-27444}:${PAPERBOAT_TUNNEL_CARRIER_QUIC_PORT:-27444}/udp"
    volumes:
      - ./operator/runtime.args:/var/lib/paperboat-tunnel/operator/runtime.args:ro
      - ./operator/runtime.credential:/var/lib/paperboat-tunnel/operator/runtime.credential:ro
      - ./operator/jwks.json:/var/lib/paperboat-tunnel/operator/jwks.json:ro
      - ./operator/revocations.json:/var/lib/paperboat-tunnel/operator/revocations.json:ro
      - ./operator/usage.key:/var/lib/paperboat-tunnel/operator/usage.key:ro
      - ./operator/deployment.json:/var/lib/paperboat-tunnel/operator/deployment.json:ro
      - ./tls:/run/paperboat-tunnel:ro
      - tunnel-runtime:/var/lib/paperboat-tunnel/runtime
      - tunnel-state:/var/lib/paperboat-tunnel/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  tunnel-admin:
    profiles: ["admin"]
    image: ${PAPERBOAT_TUNNEL_IMAGE:?set PAPERBOAT_TUNNEL_IMAGE}
    volumes:
      - ./operator:/var/lib/paperboat-tunnel/operator
      - ./tls:/run/paperboat-tunnel:ro

volumes:
  tunnel-runtime:
  tunnel-state:
