services:
  paperboat-self-hosted:
    image: ${PAPERBOAT_IMAGE:?set PAPERBOAT_IMAGE to a signed Paperboat release image}
    restart: unless-stopped
    read_only: true
    environment:
      PAPERBOAT_CONTROL_URL: ${PAPERBOAT_CONTROL_URL:?set the HTTPS control-plane URL}
      # First start only: a token from pb machine add. The state volume keeps the enrollment, so a restart needs none.
      PAPERBOAT_ENROLLMENT_CREDENTIAL: ${PAPERBOAT_ENROLLMENT_CREDENTIAL:-}
      PAPERBOAT_WORKSPACE_ROOT: /workspace
    volumes:
      - paperboat-state:/var/lib/paperboat
      - paperboat-workspace:/workspace
    tmpfs:
      - /run:mode=755,nosuid,nodev
      - /tmp:mode=1777,nosuid,nodev

volumes:
  paperboat-state:
  paperboat-workspace:
